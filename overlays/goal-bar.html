<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Goal Bar</title>
<script type="application/json" id="overlay-manifest">
{
  "name": "Goal Bar",
  "description": "Glowing progress bar with horizontal and vertical layouts for followers, tips, subscriptions, or bits.",
  "category": "goals",
  "canvas": { "w": 860, "h": 560 },
  "settings": ["label", "current", "target", "format", "symbol", "layout", "size", "shell", "icon", "corners", "width", "color", "shellColor", "track", "labelColor", "font", "weight", "tiltX", "tiltY", "scale", "glow"],
  "studioView": "goalBarView"
}
</script>
<link rel="stylesheet" href="/assets/overlay-surface.css" />
<style>
  :root {
    --accent: 200, 245, 122;     /* fill + glow      */
    --shell: 24, 24, 27;         /* capsule body     */
    --track: 10, 10, 12;         /* empty bar        */
    --ink: #f4f6f2;
    --dim: rgba(244, 246, 242, 0.72);
    --scale: 1;
    --weight: 700;
    --glow: 1;
    --radius: 999px;
    --bar-thick: 42px;
    --shell-pad: 16px;
    --name-size: 15px;
    --value-size: 15px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body {
    display: grid;
    place-items: center;
    color: var(--ink);
    font-family: var(--font-stack, "Segoe UI", system-ui, sans-serif);
  }
  body > .overlay-content { grid-area: 1 / 1; }
  html.overlay-studio-preview,
  html.overlay-studio-preview body {
    background: var(--overlay-preview-background, #1c2429);
  }

  .overlay-content {
    padding: 16px;
    perspective: 1200px;
    transform: scale(var(--scale));
  }

  /* ---------- shell ---------- */
  .goal {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: var(--shell-pad) calc(var(--shell-pad) + 4px);
    width: 640px;
    border-radius: var(--radius);
    background: rgb(var(--shell));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.07),
      0 18px 38px rgba(0,0,0,0.45);
    transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
    transform-style: preserve-3d;
    transition: transform .5s ease;
  }
  .goal.bare {
    background: transparent;
    box-shadow: none;
    padding: 4px 0;
  }

  /* ---------- head row ---------- */
  .head {
    display: flex; align-items: center; gap: 10px;
    padding: 0 6px;
  }

  .badge {
    width: 26px; height: 26px; flex: 0 0 auto;
    border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(0,0,0,0.55);
    box-shadow: inset 0 0 0 1px rgba(var(--accent), 0.35);
  }
  .badge svg { width: 14px; height: 14px; fill: rgb(var(--accent)); }
  .goal.bare .badge { background: transparent; box-shadow: none; }

  .name {
    font-size: var(--name-size);
    font-weight: var(--weight);
    letter-spacing: .13em;
    text-transform: uppercase;
    white-space: nowrap;
    max-width: 62%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .amount {
    margin-left: auto;
    font-size: var(--value-size);
    font-weight: var(--weight);
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    max-width: 36%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- bar ---------- */
  .track {
    position: relative;
    height: var(--bar-thick);
    border-radius: var(--radius);
    background: rgb(var(--track));
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .goal.bare .track {
    background: rgba(255,255,255,0.18);
    box-shadow: none;
  }

  .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: calc(var(--pct, 0) * 100%);
    border-radius: var(--radius);
    background: rgb(var(--accent));
    box-shadow:
      0 0 calc(12px * var(--glow)) rgba(var(--accent), 0.75),
      0 0 calc(30px * var(--glow)) rgba(var(--accent), 0.35);
    transition: width .85s cubic-bezier(.22,.9,.28,1), height .85s cubic-bezier(.22,.9,.28,1);
  }

  /* ---------- vertical ---------- */
  .goal.vertical {
    flex-direction: row;
    align-items: stretch;
    gap: 12px;
    width: 132px;
    height: 420px;
    padding: calc(var(--shell-pad) + 2px) var(--shell-pad);
  }
  .goal.vertical .head {
    flex-direction: column-reverse;
    align-items: center;
    gap: 12px;
    padding: 0;
  }
  .goal.vertical .name,
  .goal.vertical .amount {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin-left: 0;
    max-width: none;
    max-height: 160px;
  }
  .goal.vertical .amount { margin-top: auto; }
  .goal.vertical .track {
    flex: 1 1 auto;
    height: auto;
    width: var(--bar-thick);
  }
  .goal.vertical .fill {
    top: auto;
    width: auto;
    left: 0; right: 0; bottom: 0;
    height: calc(var(--pct, 0) * 100%);
    min-width: 0;
  }

  /* ---------- sizes ---------- */
  .goal.compact { --bar-thick: 30px; --shell-pad: 11px; --name-size: 13px; --value-size: 13px; }
  .goal.compact.vertical { width: 104px; height: 340px; }
  .goal.thin    { --bar-thick: 20px; --shell-pad: 8px;  --name-size: 12px; --value-size: 12px; gap: 6px; }
  .goal.thin.vertical { width: 84px; height: 300px; }

  /* ---------- event feedback ---------- */
  @keyframes bump {
    0% { scale: 1; } 40% { scale: 1.03; } 100% { scale: 1; }
  }
  .goal.bumped { animation: bump .55s cubic-bezier(.22,.9,.28,1); }

  @keyframes sheen {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
  .fill::after {
    content: "";
    position: absolute; inset: 0;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    animation: sheen 2.8s ease-in-out infinite;
  }
  .goal.vertical .fill::after { display: none; }

  .toast {
    position: absolute;
    right: 18px; top: -6px;
    font-size: 16px; font-weight: var(--weight);
    color: rgb(var(--accent));
    text-shadow: 0 0 14px rgba(var(--accent), .75);
    opacity: 0; pointer-events: none;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(4px); }
    20% { opacity: 1; transform: translateY(-8px); }
    100% { opacity: 0; transform: translateY(-34px); }
  }
  .toast.show { animation: rise 1.4s ease-out; }

  @keyframes done-pulse {
    0%, 100% { --glow: 1.1; }
    50% { --glow: 2.2; }
  }
  .goal.complete .fill { animation: done-pulse 2s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .fill, .goal { transition: none; }
    .goal.bumped, .toast.show, .fill::after, .goal.complete .fill { animation: none; }
  }
</style>
</head>
<body class="overlay-surface">
  <main class="overlay-content">
    <div class="goal" id="goal">
      <div class="head">
        <span class="badge" id="badge"></span>
        <span class="name" id="name">Followers</span>
        <span class="amount" id="amount">0 / 100</span>
      </div>
      <div class="track"><span class="fill" id="fill"></span></div>
      <div class="toast" id="toast"></div>
    </div>
  </main>

<script>
(() => {
  "use strict";

  const query = new URLSearchParams(location.search);
  const instanceId = query.get("i") || "";
  const customizerMode = query.get("customizer") === "1";
  if (query.get("preview") === "studio" || location.protocol === "file:") {
    document.documentElement.classList.add("overlay-studio-preview");
  }

  const goal = document.getElementById("goal");
  const badge = document.getElementById("badge");
  const nameEl = document.getElementById("name");
  const amountEl = document.getElementById("amount");
  const fill = document.getElementById("fill");
  const toastEl = document.getElementById("toast");

  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, Number.isFinite(n) ? n : lo));
  const num = (key, dflt) => {
    const raw = parseFloat(query.get(key));
    return Number.isFinite(raw) ? raw : dflt;
  };
  const pick = (value, choices, dflt) => {
    const candidate = String(value || "").trim().toLowerCase();
    return choices.includes(candidate) ? candidate : dflt;
  };
  const color = (value, dflt) => {
    const candidate = String(value || "").trim().replace(/^#/, "").toLowerCase();
    return /^[0-9a-f]{6}$/.test(candidate) ? candidate : dflt;
  };
  const hexToRgb = value => {
    const hex = String(value || "").trim().replace(/^#/, "");
    if (!/^[0-9a-f]{6}$/i.test(hex)) return null;
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };

  const ICONS = {
    followers: '<svg viewBox="0 0 24 24"><path d="M4 6h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm14 4 4-2.5v9L18 14z"/></svg>',
    tips:      '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm.9 15.4v1.3h-1.6v-1.3c-1.6-.2-2.7-1.1-2.9-2.6h1.7c.1.7.8 1.2 1.9 1.2 1 0 1.7-.4 1.7-1.1 0-.6-.4-.9-1.7-1.2l-1-.2c-1.6-.4-2.4-1.2-2.4-2.5 0-1.4 1-2.3 2.7-2.5V7.2h1.6v1.3c1.5.2 2.5 1.1 2.6 2.5h-1.6c-.1-.7-.7-1.1-1.6-1.1s-1.5.4-1.5 1c0 .5.4.8 1.5 1.1l1 .2c1.8.4 2.6 1.2 2.6 2.6 0 1.5-1.1 2.4-2.9 2.6z"/></svg>',
    subs:      '<svg viewBox="0 0 24 24"><path d="m12 2 3 6.6 7 .9-5.1 4.7 1.3 7L12 17.8 5.8 21.2l1.3-7L2 9.5l7-.9z"/></svg>',
    bits:      '<svg viewBox="0 0 24 24"><path d="M12 2 3 12l9 10 9-10zm0 4.2 5.2 5.8L12 17.8 6.8 12z"/></svg>',
  };

  const FONTS = {
    sans:    '"Segoe UI", system-ui, sans-serif',
    display: '"Bahnschrift", "Segoe UI Semibold", system-ui, sans-serif',
    round:   '"Fredoka", "Segoe UI", system-ui, sans-serif',
    mono:    '"Cascadia Mono", Consolas, monospace',
    serif:   'Georgia, "Times New Roman", serif',
  };

  const state = {
    label: query.get("label") || "Followers",
    current: num("current", 0),
    target: num("target", 100),
    format: (query.get("format") || "number").toLowerCase(),
    symbol: query.get("symbol") || "$",
    color: query.get("color") || query.get("a") || "c8f57a",
    track: query.get("track") || query.get("trackColor") || "0a0a0c",
    labelColor: query.get("labelColor") || "f4f6f2",
    shellColor: query.get("shellColor") || "18181b",
    font: query.get("font") || "sans",
    weight: num("weight", 700),
    scale: num("scale", 1),
    glow: num("glow", 1),
    layout: query.get("layout") || "horizontal",
    size: query.get("size") || "full",
    shell: query.get("shell") || "on",
    icon: query.get("icon") || "followers",
    corners: query.get("corners") || "round",
    width: num("width", 640),
    tiltX: num("tiltX", 0),
    tiltY: num("tiltY", 0),
  };

  function applyAppearance() {
    const root = document.documentElement;

    root.style.setProperty("--accent", hexToRgb(state.color).join(","));
    root.style.setProperty("--shell", hexToRgb(state.shellColor).join(","));
    root.style.setProperty("--track", hexToRgb(state.track).join(","));
    root.style.setProperty("--ink", `#${state.labelColor}`);
    root.style.setProperty("--dim", `rgba(${hexToRgb(state.labelColor).join(",")},.72)`);
    root.style.setProperty("--font-stack", FONTS[state.font] || FONTS.sans);
    root.style.setProperty("--weight", String(state.weight));
    root.style.setProperty("--scale", String(state.scale));
    root.style.setProperty("--glow", String(state.glow));
    root.style.setProperty("--radius", state.corners === "square" ? "10px" : "999px");

    goal.classList.toggle("vertical", state.layout === "vertical");
    goal.classList.toggle("compact", state.size === "compact");
    goal.classList.toggle("thin", state.size === "thin");
    goal.classList.toggle("bare", state.shell === "off");
    goal.style.setProperty("--tilt-x", `${state.tiltX}deg`);
    goal.style.setProperty("--tilt-y", `${state.tiltY}deg`);
    goal.style.width = state.layout === "vertical" ? "" : `${state.width}px`;

    if (state.icon !== "none" && ICONS[state.icon]) {
      badge.innerHTML = ICONS[state.icon];
      badge.style.display = "";
    } else {
      badge.replaceChildren();
      badge.style.display = "none";
    }
  }

  function formatAmount(n) {
    if (state.format === "currency") {
      const rounded = Math.round(n * 100) / 100;
      return `${state.symbol}${rounded.toLocaleString("en-US", {
        minimumFractionDigits: rounded % 1 ? 2 : 0,
        maximumFractionDigits: 2,
      })}`;
    }
    return Math.round(n).toLocaleString("en-US");
  }

  function render() {
    const ratio = clamp(state.current / state.target, 0, 1);
    fill.style.setProperty("--pct", ratio.toFixed(4));
    nameEl.textContent = state.label;
    amountEl.textContent = `${formatAmount(state.current)} / ${formatAmount(state.target)}`;
    goal.classList.toggle("complete", ratio >= 1);
  }

  function celebrate(text) {
    goal.classList.remove("bumped");
    void goal.offsetWidth;
    goal.classList.add("bumped");
    if (!text) return;
    toastEl.textContent = text;
    toastEl.classList.remove("show");
    void toastEl.offsetWidth;
    toastEl.classList.add("show");
  }

  function addProgress(amount, text) {
    const delta = Number(amount);
    if (!Number.isFinite(delta) || delta === 0) return;
    state.current = clamp(state.current + delta, 0, 1_000_000_000);
    render();
    const signed = delta > 0
      ? `+${formatAmount(delta)}`
      : `-${formatAmount(Math.abs(delta))}`;
    celebrate(text || signed);
  }

  function setGoal(patch = {}) {
    const next = { ...state, ...(patch && typeof patch === "object" ? patch : {}) };
    state.label = String(next.label || "Followers").trim().replace(/\s+/g, " ").slice(0, 64) || "Followers";
    state.current = clamp(Number(next.current), 0, 1_000_000_000);
    state.target = clamp(Number(next.target), 0.01, 1_000_000_000);
    state.format = pick(next.format, ["currency", "number"], "number");
    state.symbol = String(next.symbol || "$").trim().slice(0, 4) || "$";
    state.color = color(next.color, "c8f57a");
    state.track = color(next.track, "0a0a0c");
    state.labelColor = color(next.labelColor, "f4f6f2");
    state.shellColor = color(next.shellColor, "18181b");
    state.font = pick(next.font, Object.keys(FONTS), "sans");
    state.weight = Math.round(clamp(Number(next.weight), 100, 900) / 100) * 100;
    state.scale = clamp(Number(next.scale), 0.5, 1.2);
    state.glow = clamp(Number(next.glow), 0, 2.5);
    state.layout = pick(next.layout, ["horizontal", "vertical"], "horizontal");
    state.size = pick(next.size, ["full", "compact", "thin"], "full");
    state.shell = pick(next.shell, ["on", "off"], "on");
    state.icon = pick(next.icon, ["followers", "tips", "subs", "bits", "none"], "followers");
    state.corners = pick(next.corners, ["round", "square"], "round");
    state.width = Math.round(clamp(Number(next.width), 240, 640));
    state.tiltX = clamp(Number(next.tiltX), -20, 20);
    state.tiltY = clamp(Number(next.tiltY), -20, 20);
    applyAppearance();
    render();
  }

  window.goalBar = { add: addProgress, set: setGoal, state };

  if (customizerMode) {
    window.addEventListener("message", event => {
      const message = event.data;
      if (
        event.source !== window.parent
        || message?.type !== "overlay-studio-draft"
        || message.overlayType !== "goal-bar"
        || String(message.instanceId || "") !== instanceId
      ) return;
      setGoal(message.state || {});
    });
  }

  function connect() {
    if (location.protocol === "file:" || !("WebSocket" in window)) return;
    let socket;
    try {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(`${protocol}//${location.host}/ws`);
    } catch { return; }
    socket.onmessage = event => {
      if (typeof event.data !== "string" || event.data.length > 64 * 1024) return;
      let message;
      try { message = JSON.parse(event.data); } catch { return; }
      if (String(message?.instanceId || "") !== instanceId) return;
      if (message.type !== "goal") return;
      setGoal(message.state || {});
      const feedback = message.event;
      if (feedback?.text) {
        celebrate(String(feedback.text).slice(0, 64));
      } else if (Number.isFinite(Number(feedback?.amount))) {
        const delta = Number(feedback.amount);
        celebrate(delta > 0
          ? `+${formatAmount(delta)}`
          : `-${formatAmount(Math.abs(delta))}`);
      }
    };
    socket.onclose = () => setTimeout(connect, 2000);
  }

  async function loadInstalledState() {
    if (!instanceId || location.protocol === "file:") return;
    try {
      const response = await fetch(`/api/goal?i=${encodeURIComponent(instanceId)}`, {
        cache: "no-store",
      });
      if (!response.ok) return;
      setGoal(await response.json());
    } catch {
      // The initial query/default state remains usable while the server reconnects.
    }
  }

  function startDemo() {
    const tick = () => {
      if (state.current >= state.target) {
        setTimeout(() => { state.current = 0; render(); }, 3000);
      } else {
        const step = state.format === "currency"
          ? Math.round(state.target * (0.05 + Math.random() * 0.1) * 2) / 2
          : Math.max(1, Math.round(state.target * (0.05 + Math.random() * 0.08)));
        addProgress(step);
      }
      setTimeout(tick, 2400 + Math.random() * 1500);
    };
    setTimeout(tick, 800);
  }

  setGoal(state);
  if (!customizerMode) {
    loadInstalledState();
    connect();
  }
  if (!instanceId && (query.get("demo") || "off").toLowerCase() === "on") {
    startDemo();
  }
})();
</script>
</body>
</html>
