<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Rotator</title>
<script type="application/json" id="overlay-manifest">
{
  "name": "Social Rotator",
  "description": "Cycles through selected social handles with configurable icon and shell shapes, timing, labels, colors, and transitions.",
  "category": "branding",
  "canvas": { "w": 640, "h": 200 },
  "settings": ["accounts", "cycle", "size", "brand", "color", "shellColor", "textColor", "prefix", "font", "weight", "timer", "showPlatform", "iconShape", "iconBackground", "rotatorShape", "transition", "scale"],
  "studioView": "socialView"
}
</script>
<link rel="stylesheet" href="/assets/fonts/overlay-fonts.css" />
<link rel="stylesheet" href="/assets/overlay-surface.css">
<style>
  :root {
    --brand: #9146ff;
    --shell: #141418;
    --ink: #ffffff;
    --scale: 1;
    --fit-scale: 1;
    --weight: 800;
    --icon: 54px;
    --name-size: 30px;
    --swap: 620ms;
    --dwell: 4s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    display: grid;
    place-items: center;
    color: var(--ink);
    font-family: var(--font-stack, "Segoe UI", system-ui, sans-serif);
  }
  html.overlay-studio-preview,
  html.overlay-studio-preview body {
    background: var(--overlay-preview-background, #16181d);
  }
  .overlay-content {
    padding: 20px;
    transform: scale(calc(var(--scale) * var(--fit-scale)));
    transform-origin: center;
  }
  .rotator {
    position: relative;
    width: max-content;
    min-width: 320px;
    max-width: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 26px 14px 14px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--shell);
    box-shadow: 0 14px 30px rgba(0, 0, 0, .42);
    isolation: isolate;
  }
  .rotator::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--brand);
    opacity: .14;
    transition: background .45s ease;
  }
  .rotator.shell-rounded { border-radius: 18px; }
  .rotator.shell-square { border-radius: 7px; }
  .rotator.shell-cut {
    border-radius: 0;
    clip-path: polygon(13px 0, 100% 0, 100% calc(100% - 13px), calc(100% - 13px) 100%, 0 100%, 0 13px);
  }
  .slot {
    min-width: max-content;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    perspective: 500px;
  }
  .rotator[data-transition="slide"] .slot.swapping {
    animation: swap-slide var(--swap) cubic-bezier(.4, 0, .2, 1);
  }
  .rotator[data-transition="fade"] .slot.swapping {
    animation: swap-fade var(--swap) ease;
  }
  .rotator[data-transition="flip"] .slot.swapping {
    animation: swap-flip var(--swap) cubic-bezier(.4, 0, .2, 1);
    transform-style: preserve-3d;
  }
  @keyframes swap-slide {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    44% { opacity: 0; transform: translateY(-18px) scale(.94); }
    45% { opacity: 0; transform: translateY(18px) scale(.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes swap-fade {
    0%, 100% { opacity: 1; transform: scale(1); }
    45%, 55% { opacity: 0; transform: scale(.96); }
  }
  @keyframes swap-flip {
    0% { opacity: 1; transform: rotateX(0); }
    48% { opacity: 0; transform: rotateX(82deg); }
    52% { opacity: 0; transform: rotateX(-82deg); }
    100% { opacity: 1; transform: rotateX(0); }
  }
  .icon {
    width: var(--icon);
    height: var(--icon);
    flex: 0 0 var(--icon);
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 14px;
    background: var(--brand);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    transition: background .45s ease;
  }
  .glyph {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
  }
  .glyph svg {
    width: 60%;
    height: 60%;
    display: block;
    overflow: visible;
    color: var(--glyph-color, #ffffff);
    fill: currentColor;
  }
  .icon.shape-circle { border-radius: 50%; }
  .icon.shape-square { border-radius: 6px; }
  .icon.shape-diamond {
    border-radius: 8px;
    transform: rotate(45deg) scale(.8);
  }
  .icon.shape-diamond .glyph { transform: rotate(-45deg) scale(1.16); }
  .icon.shape-hex {
    border-radius: 0;
    clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%);
  }
  .rotator.symbols-only .icon {
    overflow: visible;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    clip-path: none;
    transform: none;
  }
  .rotator.symbols-only .icon .glyph { transform: none; }
  .rotator.symbols-only .glyph svg { width: 78%; height: 78%; }
  .text {
    min-width: max-content;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .platform {
    color: var(--brand);
    font-size: 13px;
    font-weight: var(--weight);
    line-height: 16px;
    text-transform: uppercase;
    white-space: nowrap;
    transition: color .45s ease;
  }
  .rotator.no-platform .platform { display: none; }
  .handle {
    color: var(--ink);
    font-size: var(--name-size);
    font-weight: var(--weight);
    line-height: 1.05;
    white-space: nowrap;
  }
  .timer {
    position: absolute;
    left: 0;
    bottom: 0;
    z-index: 2;
    width: 100%;
    height: 3px;
    background: var(--brand);
    transform-origin: left center;
    transition: background .45s ease;
  }
  .timer.run { animation: drain var(--dwell) linear; }
  .rotator.no-timer .timer { display: none; }
  @keyframes drain {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }
  .rotator.size-small { --icon: 40px; --name-size: 22px; min-width: 250px; }
  .rotator.size-large { --icon: 68px; --name-size: 38px; min-width: 390px; }
  @media (prefers-reduced-motion: reduce) {
    .slot.swapping,
    .timer.run { animation: none !important; }
  }
</style>
</head>
<body class="overlay-surface">
  <main class="overlay-content" id="content" hidden>
    <div class="rotator" id="rotator">
      <div class="slot" id="slot">
        <span class="icon" id="icon"><span class="glyph" id="glyph"></span></span>
        <span class="text">
          <span class="platform" id="platform"></span>
          <span class="handle" id="handle"></span>
        </span>
      </div>
      <span class="timer" id="timer"></span>
    </div>
  </main>

<script src="/assets/social-platforms.js?v=2"></script>
<script>
(() => {
  "use strict";

  const OVERLAY_TYPE = "social-rotator";
  const query = new URLSearchParams(location.search);
  const instanceId = query.get("i") || "";
  if (query.get("preview") === "studio" || location.protocol === "file:") {
    document.documentElement.classList.add("overlay-studio-preview");
  }
  const social = window.OverlaySocial;
  const content = document.getElementById("content");
  const rotator = document.getElementById("rotator");
  const slot = document.getElementById("slot");
  const icon = document.getElementById("icon");
  const glyph = document.getElementById("glyph");
  const platform = document.getElementById("platform");
  const handle = document.getElementById("handle");
  const timer = document.getElementById("timer");
  let settings = social.normalize({}, OVERLAY_TYPE);
  let accounts = [];
  let index = 0;
  let cycleTimer = null;
  let paintTimer = null;
  let settingsKey = "";
  let fitFrame = 0;

  function fitToCanvas() {
    cancelAnimationFrame(fitFrame);
    fitFrame = requestAnimationFrame(() => {
      if (content.hidden) return;
      const availableWidth = Math.max(1, innerWidth - 40);
      const availableHeight = Math.max(1, innerHeight - 40);
      const fit = Math.max(
        .04,
        Math.min(
          1,
          availableWidth / Math.max(1, rotator.scrollWidth * settings.scale),
          availableHeight / Math.max(1, rotator.scrollHeight * settings.scale),
        ),
      );
      document.documentElement.style.setProperty(
        "--fit-scale",
        fit.toFixed(4),
      );
    });
  }

  function restart(element, className) {
    element.classList.remove(className);
    void element.offsetWidth;
    element.classList.add(className);
  }

  function paint() {
    const account = accounts[index];
    const meta = social.PLATFORMS[account.platform];
    const shell = `#${settings.shellColor}`;
    const brand = settings.brand && meta ? meta.color : `#${settings.color}`;
    const iconSurface = settings.brand && meta?.surface
      ? meta.surface
      : brand;
    const bareGlyph = settings.brand && meta ? meta.bare || meta.color : brand;
    const glyphColor = settings.iconBackground
      ? social.ensureContrast(
        settings.brand && meta?.ink ? meta.ink : social.contrast(iconSurface),
        iconSurface,
      )
      : social.ensureContrast(bareGlyph, shell, meta?.bare);
    const accentColor = social.ensureContrast(brand, shell, meta?.bare);
    rotator.style.setProperty("--brand", accentColor);
    icon.style.setProperty("--brand", iconSurface);
    icon.style.setProperty(
      "--glyph-color",
      glyphColor,
    );
    const artwork = social.createGlyph(
      account.platform,
      settings.brand,
      !settings.iconBackground,
    );
    glyph.replaceChildren(artwork);
    platform.textContent = meta?.name || account.platform;
    handle.textContent = account.handle
      ? `${settings.prefix}${account.handle}`
      : settings.prefix;
    fitToCanvas();
  }

  function clearRotation() {
    clearTimeout(cycleTimer);
    clearTimeout(paintTimer);
    cycleTimer = null;
    paintTimer = null;
    slot.classList.remove("swapping");
    timer.classList.remove("run");
  }

  function scheduleNext() {
    cycleTimer = setTimeout(() => {
      index = (index + 1) % accounts.length;
      restart(slot, "swapping");
      paintTimer = setTimeout(paint, 285);
      if (settings.timer) restart(timer, "run");
      scheduleNext();
    }, settings.cycle * 1000);
  }

  function startRotation() {
    clearRotation();
    paint();
    if (settings.timer) restart(timer, "run");
    if (accounts.length > 1) scheduleNext();
  }

  function apply(next) {
    const nextKey = JSON.stringify(next);
    if (nextKey === settingsKey) return;
    settingsKey = nextKey;
    settings = next;
    accounts = settings.accounts.filter(account => account.enabled);
    index = 0;
    content.hidden = accounts.length === 0;
    clearRotation();
    if (!accounts.length) return;

    document.documentElement.style.setProperty("--shell", `#${settings.shellColor}`);
    document.documentElement.style.setProperty("--ink", `#${settings.textColor}`);
    document.documentElement.style.setProperty("--font-stack", social.FONTS[settings.font]);
    document.documentElement.style.setProperty("--weight", String(settings.weight));
    document.documentElement.style.setProperty("--scale", String(settings.scale));
    document.documentElement.style.setProperty("--dwell", `${settings.cycle}s`);

    rotator.className = "rotator";
    rotator.dataset.transition = settings.transition;
    if (settings.rotatorShape !== "capsule") {
      rotator.classList.add(`shell-${settings.rotatorShape}`);
    }
    if (settings.size !== "medium") rotator.classList.add(`size-${settings.size}`);
    if (!settings.timer) rotator.classList.add("no-timer");
    if (!settings.showPlatform) rotator.classList.add("no-platform");
    if (!settings.iconBackground) rotator.classList.add("symbols-only");
    icon.className = `icon shape-${settings.iconShape}`;
    startRotation();
  }

  addEventListener("resize", fitToCanvas);
  document.fonts?.ready.then(fitToCanvas);
  social.load(instanceId, OVERLAY_TYPE, query).then(initial => {
    apply(initial);
    social.listen(instanceId, OVERLAY_TYPE, apply);
  });
})();
</script>
</body>
</html>
