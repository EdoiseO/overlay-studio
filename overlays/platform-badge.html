<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform Badge</title>
<script type="application/json" id="overlay-manifest">
{
  "name": "Platform Badge",
  "description": "A compact two-tone badge: a white square with the platform logo beside a nameplate filled with the platform's own brand color.",
  "category": "branding",
  "exportable": true,
  "canvas": { "w": 420, "h": 110 },
  "settings": ["platform", "handle", "prefix", "useBrandColor", "badgeColor", "corners", "width", "height", "scale", "font", "weight"],
  "studioView": "platformBadgeView"
}
</script>
<link rel="stylesheet" href="/assets/fonts/overlay-fonts.css" />
<link rel="stylesheet" href="/assets/overlay-surface.css">
<style>
  :root {
    --fill: #9146ff;
    --ink: #ffffff;
    --scale: 1;
    --fit-scale: 1;
    --weight: 700;
    --corners: 4px;
    --badge-width: 340px;
    --badge-height: 96px;
    --name-size: 34px;
    --pad-x: 30px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    display: grid;
    place-items: center;
    font-family: var(--font-stack, "Segoe UI", system-ui, sans-serif);
  }
  html.overlay-studio-preview,
  html.overlay-studio-preview body {
    background: var(--overlay-preview-background, #16181d);
  }

  .overlay-content { padding: 18px; }

  .badge {
    display: flex;
    align-items: stretch;
    width: max-content;
    min-width: var(--badge-width);
    transform: scale(calc(var(--scale) * var(--fit-scale)));
    transform-origin: center;
  }

  .logo-tile {
    flex: 0 0 var(--badge-height);
    width: var(--badge-height);
    height: var(--badge-height);
    display: grid;
    place-items: center;
    background: #ffffff;
    border-radius: var(--corners) 0 0 var(--corners);
  }
  .logo-tile svg {
    width: 56%;
    height: 56%;
    display: block;
    color: var(--fill);
    fill: currentColor;
  }

  .name-tile {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    min-width: max(0px, calc(var(--badge-width) - var(--badge-height)));
    height: var(--badge-height);
    padding: 0 var(--pad-x);
    background: var(--fill);
    border-radius: 0 var(--corners) var(--corners) 0;
  }
  .name {
    color: var(--ink);
    font-size: var(--name-size);
    font-weight: var(--weight);
    line-height: 1;
    white-space: nowrap;
  }
</style>
</head>
<body class="overlay-surface">
  <main class="overlay-content" id="content" hidden>
    <div class="badge" id="badge">
      <span class="logo-tile" id="logoTile"></span>
      <span class="name-tile"><span class="name" id="name"></span></span>
    </div>
  </main>

<script src="/assets/social-platforms.js?v=2"></script>
<script>
(() => {
  "use strict";

  const OVERLAY_TYPE = "platform-badge";
  const query = new URLSearchParams(location.search);
  const instanceId = query.get("i") || "";
  const customizerMode = query.get("customizer") === "1";
  if (query.get("preview") === "studio" || location.protocol === "file:") {
    document.documentElement.classList.add("overlay-studio-preview");
  }

  const social = window.OverlaySocial;
  const content = document.getElementById("content");
  const badge = document.getElementById("badge");
  const logoTile = document.getElementById("logoTile");
  const nameEl = document.getElementById("name");
  let requestedScale = 1;
  let fitFrame = 0;

  const DEFAULTS = {
    platform: "twitch",
    handle: "yourname",
    prefix: "",
    useBrandColor: true,
    badgeColor: "9146ff",
    corners: 4,
    width: 340,
    height: 96,
    scale: 1,
    font: "display",
    weight: 700,
  };

  const clamp = (value, minimum, maximum, fallback) => {
    const numeric = Number(value);
    return Math.max(minimum, Math.min(maximum, Number.isFinite(numeric) ? numeric : fallback));
  };
  const hex = (value, fallback) => {
    const candidate = String(value || "").trim().replace(/^#/, "").toLowerCase();
    return /^[0-9a-f]{6}$/.test(candidate) ? candidate : fallback;
  };
  const bool = (value, fallback) => (typeof value === "boolean" ? value : fallback);
  const short = (value, maximum, fallback = "") => {
    const candidate = String(value ?? "").replace(/\s+/g, " ").trim();
    return (candidate || fallback).slice(0, maximum);
  };

  function normalize(raw) {
    const source = raw && typeof raw === "object" ? raw : {};
    const platform = social?.PLATFORMS[String(source.platform || "").toLowerCase()]
      ? String(source.platform).toLowerCase()
      : DEFAULTS.platform;
    return {
      platform,
      handle: short(source.handle, 32, DEFAULTS.handle),
      prefix: short(source.prefix, 4, DEFAULTS.prefix),
      useBrandColor: bool(source.useBrandColor, DEFAULTS.useBrandColor),
      badgeColor: hex(source.badgeColor, DEFAULTS.badgeColor),
      corners: Math.round(clamp(source.corners, 0, 24, DEFAULTS.corners)),
      width: Math.round(clamp(source.width, 220, 720, DEFAULTS.width)),
      height: Math.round(clamp(source.height, 48, 160, DEFAULTS.height)),
      scale: clamp(source.scale, 0.5, 2, DEFAULTS.scale),
      font: social?.FONTS[source.font] ? String(source.font) : DEFAULTS.font,
      weight: Math.round(clamp(source.weight, 300, 900, DEFAULTS.weight)),
    };
  }

  function fitToCanvas() {
    cancelAnimationFrame(fitFrame);
    fitFrame = requestAnimationFrame(() => {
      if (content.hidden) return;
      const naturalWidth = badge.scrollWidth;
      const naturalHeight = badge.scrollHeight;
      const availableWidth = Math.max(1, innerWidth - 36);
      const availableHeight = Math.max(1, innerHeight - 36);
      const fit = Math.max(
        .04,
        Math.min(
          1,
          availableWidth / Math.max(1, naturalWidth * requestedScale),
          availableHeight / Math.max(1, naturalHeight * requestedScale),
        ),
      );
      document.documentElement.style.setProperty("--fit-scale", fit.toFixed(4));
    });
  }

  function apply(settings) {
    if (!social) return;
    const meta = social.PLATFORMS[settings.platform];
    content.hidden = false;
    const fill = settings.useBrandColor && meta ? meta.color : `#${settings.badgeColor}`;
    const ink = social.contrast(fill);

    document.documentElement.style.setProperty("--fill", fill);
    document.documentElement.style.setProperty("--ink", ink);
    document.documentElement.style.setProperty("--font-stack", social.FONTS[settings.font]);
    document.documentElement.style.setProperty("--weight", String(settings.weight));
    document.documentElement.style.setProperty("--corners", `${settings.corners}px`);
    document.documentElement.style.setProperty("--badge-width", `${settings.width}px`);
    document.documentElement.style.setProperty("--badge-height", `${settings.height}px`);
    document.documentElement.style.setProperty(
      "--name-size",
      `${clamp(settings.height * .3542, 16, 58, 34).toFixed(2)}px`,
    );
    document.documentElement.style.setProperty(
      "--pad-x",
      `${clamp(settings.height * .3125, 14, 48, 30).toFixed(2)}px`,
    );
    document.documentElement.style.setProperty("--scale", String(settings.scale));
    requestedScale = settings.scale;

    logoTile.replaceChildren(social.createGlyph(settings.platform, true, false));
    logoTile.firstChild?.style.setProperty("color", meta ? meta.color : fill);
    const label = settings.handle
      ? `${settings.prefix}${settings.handle}`
      : "";
    nameEl.textContent = label;

    fitToCanvas();
  }

  async function load() {
    let saved = DEFAULTS;
    if (instanceId && location.protocol !== "file:") {
      try {
        const response = await fetch(`/api/config?i=${encodeURIComponent(instanceId)}`, {
          cache: "no-store",
        });
        if (response.ok) {
          const payload = await response.json();
          if (payload.platformBadge && typeof payload.platformBadge === "object") {
            saved = payload.platformBadge;
          }
        }
      } catch {}
    }
    const overrides = {};
    ["platform", "handle", "prefix", "badgeColor", "corners", "width", "height", "scale", "font", "weight"].forEach(key => {
      if (query.has(key)) overrides[key] = query.get(key);
    });
    if (query.has("useBrandColor")) {
      overrides.useBrandColor = !["off", "false", "0"].includes(
        String(query.get("useBrandColor")).toLowerCase(),
      );
    }
    return normalize({ ...saved, ...overrides });
  }

  function listen() {
    if (customizerMode) {
      window.addEventListener("message", event => {
        if (
          event.source !== window.parent
          || event.data?.type !== "overlay-studio-draft"
          || event.data?.overlayType !== OVERLAY_TYPE
          || String(event.data?.instanceId || "") !== instanceId
          || !event.data?.config?.platformBadge
        ) return;
        apply(normalize(event.data.config.platformBadge));
      });
    }
    if (location.protocol === "file:" || !("WebSocket" in window)) return;
    const connect = () => {
      let socket;
      try {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${location.host}/ws`);
      } catch {
        setTimeout(connect, 2000);
        return;
      }
      socket.onmessage = event => {
        if (typeof event.data !== "string" || event.data.length > 64 * 1024) return;
        let message;
        try { message = JSON.parse(event.data); } catch { return; }
        if (
          message?.type === "config"
          && String(message.instanceId || "") === instanceId
          && message.config?.platformBadge
        ) {
          apply(normalize(message.config.platformBadge));
        }
      };
      socket.onclose = () => setTimeout(connect, 2000);
    };
    connect();
  }

  addEventListener("resize", fitToCanvas);
  document.fonts?.ready.then(fitToCanvas);
  load().then(settings => {
    apply(settings);
    listen();
  });
})();
</script>
</body>
</html>
