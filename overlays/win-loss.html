<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Win / Loss Record</title>
<script type="application/json" id="overlay-manifest">
{
  "name": "Match Record",
  "description": "A live win and loss banner with independent counters and color.",
  "category": "gaming",
  "canvas": { "w": 900, "h": 320 },
  "settings": ["title", "wins", "losses", "accent"],
  "studioView": "counterView"
}
</script>
<link rel="stylesheet" href="/assets/overlay-surface.css" />
<style>
  :root {
    --accent: #d7ff45;
    --ink: #f5f8fb;
    --muted: #9aa7b3;
    --panel: rgba(12, 17, 22, 0.94);
    --line: rgba(255, 255, 255, 0.14);
    --identity-width: 260px;
    --identity-padding-x: 18px;
    --score-width: 116px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    color: var(--ink);
    font-family: "Segoe UI", Arial, sans-serif;
  }

  .stage {
    width: fit-content;
    max-width: calc(100vw - 48px);
  }

  .record {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, var(--identity-width)) repeat(2, var(--score-width));
    width: fit-content;
    min-height: 118px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
  }

  .record::before {
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    height: 4px;
    background: var(--accent);
    content: "";
  }

  .identity {
    display: flex;
    min-width: 0;
    flex-direction: column;
    justify-content: center;
    padding: 22px var(--identity-padding-x) 18px;
    border-right: 1px solid var(--line);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 68%, transparent);
  }

  .title {
    margin-top: 7px;
    overflow: hidden;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: 0;
    text-overflow: ellipsis;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .title-measure {
    position: fixed;
    top: -10000px;
    left: -10000px;
    width: max-content;
    max-width: none;
    overflow: visible;
    visibility: hidden;
    pointer-events: none;
  }

  .score {
    display: flex;
    align-items: center;
    flex-direction: column;
    justify-content: center;
    padding: 18px 12px 12px;
  }

  .score + .score {
    border-left: 1px solid var(--line);
  }

  .value {
    font-size: 46px;
    font-weight: 800;
    line-height: 1;
  }

  .label {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  @media (max-width: 560px) {
    :root {
      --identity-padding-x: 16px;
      --score-width: 82px;
    }

    .identity {
      padding-right: var(--identity-padding-x);
      padding-left: var(--identity-padding-x);
    }

    .value {
      font-size: 36px;
    }
  }
</style>
</head>
<body class="overlay-surface">
  <main class="stage overlay-content">
    <section class="record" aria-label="Current match record">
      <div class="identity">
        <div class="eyebrow"><span class="dot"></span>Live record</div>
        <div class="title" id="title">Marvel Rivals</div>
      </div>
      <div class="score">
        <div class="value" id="losses">0</div>
        <div class="label">Losses</div>
      </div>
      <div class="score">
        <div class="value" id="wins">0</div>
        <div class="label">Wins</div>
      </div>
    </section>
  </main>

<script>
const title = document.getElementById("title");
const wins = document.getElementById("wins");
const losses = document.getElementById("losses");
const record = document.querySelector(".record");
const titleMeasure = title.cloneNode(false);
const query = new URLSearchParams(location.search);
const instanceId = query.get("i") || "";
const MIN_IDENTITY_WIDTH = 188;
const MAX_IDENTITY_WIDTH = 480;
const MIN_RESPONSIVE_IDENTITY_WIDTH = 140;
const CANVAS_GUTTER = 48;
const TITLE_RENDERING_BUFFER = 40;
titleMeasure.removeAttribute("id");
titleMeasure.classList.add("title-measure");
titleMeasure.setAttribute("aria-hidden", "true");
document.body.append(titleMeasure);
if (query.get("preview") === "studio") {
  document.documentElement.classList.add("overlay-studio-preview");
}

function syncRecordWidth() {
  const rootStyle = getComputedStyle(document.documentElement);
  const scoreWidth = Number.parseFloat(rootStyle.getPropertyValue("--score-width")) || 116;
  const paddingX =
    Number.parseFloat(rootStyle.getPropertyValue("--identity-padding-x")) || 18;
  const textWidth = titleMeasure.getBoundingClientRect().width;
  const desiredWidth = Math.ceil(
    textWidth + paddingX * 2 + TITLE_RENDERING_BUFFER,
  );
  const availableWidth = Math.max(
    MIN_RESPONSIVE_IDENTITY_WIDTH,
    window.innerWidth - CANVAS_GUTTER - scoreWidth * 2,
  );
  const maximumWidth = Math.min(MAX_IDENTITY_WIDTH, availableWidth);
  const identityWidth = Math.min(
    Math.max(desiredWidth, MIN_IDENTITY_WIDTH),
    maximumWidth,
  );
  record.style.setProperty("--identity-width", `${identityWidth}px`);
  const overflow = Math.ceil(title.scrollWidth - title.clientWidth);
  if (overflow > 1 && identityWidth < maximumWidth) {
    const correctedWidth = Math.min(identityWidth + overflow + 4, maximumWidth);
    record.style.setProperty("--identity-width", `${correctedWidth}px`);
  }
}

function render(state) {
  if (!state) return;
  title.textContent = state.title || "Match record";
  titleMeasure.textContent = title.textContent;
  wins.textContent = Math.max(0, Number(state.wins) || 0);
  losses.textContent = Math.max(0, Number(state.losses) || 0);
  if (/^[0-9a-f]{6}$/i.test(state.accent || "")) {
    document.documentElement.style.setProperty("--accent", `#${state.accent}`);
  }
  requestAnimationFrame(syncRecordWidth);
}

async function loadState() {
  try {
    const endpoint = new URL("/api/win-loss", location.origin);
    if (instanceId) endpoint.searchParams.set("i", instanceId);
    const response = await fetch(endpoint, { cache: "no-store" });
    if (response.ok) render(await response.json());
  } catch {}
}

function connect() {
  if (!("WebSocket" in window)) return;
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  const socket = new WebSocket(`${protocol}//${location.host}/ws`);
  socket.onmessage = event => {
    try {
      const message = JSON.parse(event.data);
      const messageInstance = String(message.instanceId || "");
      if (message.type === "win-loss" && messageInstance === instanceId) {
        render(message.state);
      }
    } catch {}
  };
  socket.onclose = () => setTimeout(connect, 1500);
}

loadState();
connect();
window.addEventListener("resize", syncRecordWidth);
document.fonts?.ready.then(syncRecordWidth);
</script>
</body>
</html>
