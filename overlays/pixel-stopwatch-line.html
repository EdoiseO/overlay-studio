<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Stopwatch Line</title>
  <script type="application/json" id="overlay-manifest">
  {
    "name": "Pixel Stopwatch Line",
    "description": "Transparent single-line Pixel UI stopwatch with persistent Studio start, pause, and reset controls.",
    "category": "utility",
    "canvas": { "w": 1200, "h": 160 },
    "settings": ["label", "showTenths", "accentColor", "textColor", "showLabel", "scale", "glow", "digitShadow"],
    "studioView": "pixelTimeView"
  }
  </script>
  <link rel="stylesheet" href="/assets/fonts/overlay-fonts.css?v=20260830-pixel-ui">
  <link rel="stylesheet" href="/assets/overlay-surface.css">
  <link rel="stylesheet" href="/assets/pixel-time.css">
  <link rel="stylesheet" href="/assets/pixel-time-line.css">
</head>
<body class="overlay-surface">
  <main class="overlay-content">
    <section class="pixel-time pixel-time-line" id="pixelTime" aria-live="polite">
      <div class="block-frame">
        <span class="tool-label" id="timeLabel">TIME SPENT</span>
        <span class="line-divider label-divider" aria-hidden="true"></span>
        <div class="time-value" id="timeValue">00:00:00</div>
        <span class="line-divider status-divider" aria-hidden="true"></span>
        <span class="tool-zone" id="timeZone">READY</span>
        <span class="line-divider date-divider" aria-hidden="true"></span>
        <span id="timeDetail">ELAPSED TIME</span>
        <span class="tool-mode" id="timeMode">STOPWATCH</span>
      </div>
    </section>
  </main>
  <script>
    window.PIXEL_TIME_TOOL = {
      overlayType: "pixel-stopwatch-line",
      kind: "stopwatch",
      layout: "line",
    };
  </script>
  <script src="/assets/pixel-time.js"></script>
</body>
</html>
