  "canvas": { "w": 1200, "h": 160 },

<style>
  :root {
    --accent: 255, 255, 255;
    --ink: 255, 255, 255;
    --tile-edge: #ffffff;
    --text-edge: #000000;
    --scale: 1;
    --weight: 800;
    --icon: 54px;
    --name-size: 34px;
    --group-gap: 26px;
    /* Sticker glyphs carry padding inside their viewBox (room for the thick
       outline), so a healthy negative margin is needed before they touch. */
    --icon-overlap: 20px;
    --name-gap: 6px;
    --tile-round: 0.3;
    --outline: 4px;
    --tile-outline: 3px;
    --fit-scale: 1;
    --content-padding: 18px;
    --shadow-filter: drop-shadow(0 3px 5px rgba(0,0,0,.45));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body {
    display: grid;
    place-items: center;
    color: rgb(var(--ink));
    font-family: var(--font-stack, "Segoe UI", system-ui, sans-serif);
  }
  body > .overlay-content { grid-area: 1 / 1; }
  html.overlay-studio-preview,
  html.overlay-studio-preview body {
    background: var(--overlay-preview-background, #16181d);
  }

  .overlay-content {
    padding: var(--content-padding);
    transform: scale(calc(var(--scale) * var(--fit-scale)));
  }

  .row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--group-gap);
    justify-content: center;
  }
  .row[data-align="left"]  { justify-content: flex-start; }
  .row[data-align="right"] { justify-content: flex-end; }
  .row[data-direction="vertical"] { flex-direction: column; }
  .row[data-wrap="off"] { flex-wrap: nowrap; }

  /* ---------- one group: icons + a single shared handle ---------- */
  .group {
    display: flex;
    align-items: center;
    gap: var(--name-gap);
    min-width: 0;
  }

  .icons {
    display: flex;
    align-items: center;
    flex: 0 0 auto;
  }

  /* Sticker mode (default): the whole group is one SVG so the white outlines
     merge into a single silhouette rather than stacking on each other. */
  .merged {
    display: block;
    filter: var(--shadow-filter);
  }
  .merged svg {
    height: var(--icon);
    width: auto;          /* aspect-ratio is pinned in JS after measuring */
    display: block;
    overflow: visible;
  }

  /* Tiled mode still uses one element per platform. */
  .icon {
    position: relative;
    width: var(--icon); height: var(--icon);
    display: grid; place-items: center;
    filter: var(--shadow-filter);
  }
  .icon svg { width: 100%; height: 100%; overflow: visible; display: block; }

  /* tiles overlap so neighbouring white outlines merge into one sticker edge */
  .icon + .icon { margin-left: calc(var(--icon-overlap, 6px) * -1); }

  .icon img { width: 100%; height: 100%; object-fit: contain; }

  /* Optional tiled look (?tile=on) — coloured chip behind the glyph. */
  .icon.tile {
    border-radius: calc(var(--icon) * var(--tile-round, 0.3));
    background: var(--brand, rgb(var(--accent)));
    box-shadow:
      0 0 0 var(--tile-outline) var(--tile-edge),
      0 3px 8px rgba(0,0,0,.4);
    filter: none;
  }
  .icon.tile svg { width: 60%; height: 60%; overflow: visible; }
  .icon.tile.round  { border-radius: 50%; }
  .icon.tile.square { border-radius: calc(var(--icon) * 0.14); }
  .icon.tile.wide   { width: calc(var(--icon) * 1.44); }
  .icon.tile.wide svg { width: 46%; height: 66%; }

  .handle {
    font-size: var(--name-size);
    font-weight: var(--weight);
    line-height: 1.05;
    white-space: nowrap;
    overflow: visible;
    -webkit-text-stroke: var(--outline) var(--text-edge);
    paint-order: stroke fill;
  }

  .legacy-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    white-space: nowrap;
  }
  .legacy-label {
    font-size: calc(var(--name-size) * .44);
    font-weight: var(--weight);
    line-height: 1;
    white-space: nowrap;
    -webkit-text-stroke: calc(var(--outline) * .65) var(--text-edge);
    paint-order: stroke fill;
  }

  /* ---------- sizes ---------- */
  .row.size-large { --icon: 60px; --name-size: 44px; --group-gap: 38px; }
  .row.size-small { --icon: 34px; --name-size: 24px; --group-gap: 22px; }

  @media (prefers-reduced-motion: reduce) {
    .icon { transition: none; }
  }
</style>

  const queryOverrides = Object.fromEntries(
    SETTING_KEYS
      .filter(key => query.has(key))
      .map(key => [key, query.get(key)]),
  );

  function parseGroups(raw) {
    const parsed = [];
    for (const chunk of String(raw || "").split(",").slice(0, 6)) {
      const separator = chunk.indexOf(":");
      const platformPart = separator >= 0 ? chunk.slice(0, separator) : chunk;
      const handlePart = separator >= 0 ? chunk.slice(separator + 1) : "";
      const platforms = [];
      for (const supplied of platformPart.split(/[+|]/)) {
        const candidate = supplied.trim().toLowerCase();
        const platform = ALIASES[candidate] || candidate;
        if (PLATFORMS[platform] && !platforms.includes(platform)) {
          platforms.push(platform);
        }
        if (platforms.length === 6) break;
      }
      if (!platforms.length) continue;
      parsed.push({
        platforms,
        handle: boundedText(handlePart, "", 128).trim(),
      });
    }
    return parsed.length ? parsed : parseGroups(DEFAULTS.groups);
  }

  function transformText(value, textCase) {
    const text = String(value || "");
    if (textCase === "upper") return text.toLocaleUpperCase();
    if (textCase === "lower") return text.toLocaleLowerCase();
    return text;
  }

  function applyAppearance(settings) {
    const root = document.documentElement;
    const accent = hexToRgb(settings.color);
    if (accent) root.style.setProperty("--accent", accent.join(","));
    const ink = hexToRgb(settings.textColor);
    if (ink) root.style.setProperty("--ink", ink.join(","));
    root.style.setProperty("--tile-edge", settings.tileEdge);
    root.style.setProperty("--text-edge", settings.textEdge);
    root.style.setProperty("--outline", `${settings.outline}px`);
    root.style.setProperty("--tile-outline", `${settings.tileOutline}px`);
    root.style.setProperty("--group-gap", `${settings.gap}px`);
    root.style.setProperty("--icon-overlap", `${settings.overlap}px`);
    root.style.setProperty("--name-gap", `${settings.nameGap}px`);
    root.style.setProperty("--tile-round", String(settings.round));
    root.style.setProperty("--font-stack", FONTS[settings.font]);
    root.style.setProperty("--weight", String(settings.weight));
    root.style.setProperty("--scale", String(settings.scale));
    root.style.setProperty("--fit-scale", "1");
    root.style.setProperty("--content-padding", `${settings.padding}px`);

    const shadowRgb = hexToRgb(settings.shadowColor) || [0, 0, 0];
    root.style.setProperty(
      "--shadow-filter",
      settings.shadow
        ? `drop-shadow(${settings.shadowX}px ${settings.shadowY}px ` +
          `${settings.shadowBlur}px rgba(${shadowRgb.join(",")},` +
          `${settings.shadowOpacity}))`
        : "none",
    );

    row.className = "row";
    if (settings.size === "large" || settings.size === "small") {
      row.classList.add(`size-${settings.size}`);
    }
    row.dataset.align = settings.align;
    row.dataset.direction = settings.direction;
    row.dataset.wrap = settings.wrap ? "on" : "off";
  }

  function buildIcon(platform, settings) {
    const meta = PLATFORMS[platform];
    const icon = document.createElement("span");
    const classes = ["icon", "tile"];
    if (settings.shape === "round") classes.push("round");
    else if (settings.shape === "square") classes.push("square");
    if (meta.wide && settings.shape !== "round") classes.push("wide");
    icon.className = classes.join(" ");
    icon.style.setProperty(
      "--brand",
      settings.brand ? meta.color : "rgb(var(--accent))",
    );

    const fill = meta.ink && settings.brand ? meta.ink : "#fff";
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "-3 -3 30 30");
    svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("fill-rule", "evenodd");
    path.setAttribute("clip-rule", "evenodd");
    path.setAttribute("d", meta.path);
    path.setAttribute("fill", fill);
    svg.append(path);
    icon.append(svg);
    return icon;
  }

  /* Sticker mode: one SVG for the whole group, drawn in two passes —
     every outline first, then every fill on top. The white edges merge into a
     single silhouette instead of one logo's outline covering its neighbour. */
  function svgElement(name, attributes = {}) {
    const element = document.createElementNS(SVG_NS, name);
    for (const [key, value] of Object.entries(attributes)) {
      element.setAttribute(key, String(value));
    }
    return element;
  }

  function applyOutline(element, fill, width, settings) {
    element.setAttribute("fill", fill);
    element.setAttribute("stroke", fill);
    element.setAttribute("stroke-width", String(width));
    element.setAttribute("stroke-linejoin", settings.join);
    element.setAttribute("stroke-linecap", "round");
    if (settings.outlineOpacity !== 1) {
      element.setAttribute("fill-opacity", String(settings.outlineOpacity));
      element.setAttribute("stroke-opacity", String(settings.outlineOpacity));
    }
  }

  function appendLogo(layers, meta, settings, widths) {
    for (const layerName of ["out", "edge", "fills"]) {
      const path = svgElement("path", {
        "fill-rule": "evenodd",
        "clip-rule": "evenodd",
        d: meta.path,
        "data-kind": "logo",
      });
      if (layerName === "out") {
        applyOutline(path, settings.tileEdge, widths.logoOuter, settings);
      } else if (layerName === "edge") {
        applyOutline(path, settings.edgeColor, widths.logoEdge, settings);
      } else {
        path.setAttribute(
          "fill",
          settings.brand ? meta.color : "rgb(var(--ink))",
        );
      }
      layers[layerName].append(path);
    }
  }

  function createTextLine(content, y, size, fill, stroke, width, settings) {
    const text = svgElement("text", {
      x: 0,
      y,
      "dominant-baseline": "central",
      "text-anchor": "start",
      "xml:space": "preserve",
      "font-size": size,
      "font-weight": settings.weight,
      "letter-spacing": settings.letterSpacing,
      "font-family": FONTS[settings.font],
      fill,
    });
    if (stroke) {
      text.setAttribute("stroke", stroke);
      text.setAttribute("stroke-width", String(width));
      text.setAttribute("stroke-linejoin", settings.join);
      if (settings.outlineOpacity !== 1) {
        text.setAttribute("fill-opacity", String(settings.outlineOpacity));
        text.setAttribute("stroke-opacity", String(settings.outlineOpacity));
      }
    }
    text.textContent = content;
    return text;
  }

  function appendTextBlock(layers, handle, settings, widths) {
    const label = transformText(settings.label, settings.textCase);
    const name = handle
      ? `${settings.prefix}${transformText(handle, settings.textCase)}`
      : "";
    if (!name && !label) return;
    const hasLabel = Boolean(label);
    const lineSeparation = (
      settings.labelSize / 2
      + settings.textSize / 2
      + settings.labelGap
      + Math.max(1, settings.textEdgeWidth)
    );
    const labelY = 12 - lineSeparation / 2;
    const handleY = hasLabel ? 12 + lineSeparation / 2 : 12;

    for (const layerName of ["out", "edge", "fills"]) {
      const layer = layers[layerName];
      const fill = layerName === "out"
        ? settings.textOutlineColor
        : layerName === "edge"
          ? settings.textEdgeColor
          : settings.textColor;
      const stroke = layerName === "fills" ? "" : fill;
      const width = layerName === "out" ? widths.textOuter : widths.textEdge;
      const parent = hasLabel
        ? svgElement("g", { "data-kind": "text" })
        : null;
      const target = parent || layer;
      if (label) {
        target.append(
          createTextLine(
            label,
            labelY,
            settings.labelSize,
            layerName === "fills" ? settings.labelColor : fill,
            stroke,
            width,
            settings,
          ),
        );
      }
      if (name) {
        const line = createTextLine(
          name,
          handleY,
          settings.textSize,
          fill,
          stroke,
          width,
          settings,
        );
        if (!parent) line.dataset.kind = "text";
        target.append(line);
      }
      if (parent) layer.append(parent);
    }
  }

  function buildMergedIcons(platforms, handle, settings) {
    const logoEdge = settings.edgeWidth * 2;
    const textEdge = settings.textEdgeWidth * 2;
    const widths = {
      logoEdge,
      logoOuter: logoEdge + settings.logoOutline * 2,
      textEdge,
      textOuter: textEdge + settings.textOutline * 2,
    };
    const holder = document.createElement("span");
    holder.className = "merged";
    const svg = svgElement("svg", {
      viewBox: "0 0 24 24",
      "aria-hidden": "true",
    });
    const layers = {
      out: svgElement("g", { class: "out" }),
      edge: svgElement("g", { class: "edge" }),
      fills: svgElement("g", { class: "fills" }),
    };
    svg.append(layers.out, layers.edge, layers.fills);

    const addText = () => appendTextBlock(layers, handle, settings, widths);
    if (settings.textSide === "left") addText();
    for (const platform of platforms) {
      appendLogo(layers, PLATFORMS[platform], settings, widths);
    }
    if (settings.textSide === "right") addText();
    holder.append(svg);
    return holder;
  }

  /* Pack by each glyph's REAL bounding box. The paths have different amounts of
     empty margin inside their 24-unit boxes, so a fixed step leaves uneven gaps.
     Measuring lets every pair sit the same distance apart, and vertically
     centres each glyph so none of them ride high or low. */
  function safeBBox(element, settings) {
    try {
      const box = element.getBBox();
      if (
        [box.x, box.y, box.width, box.height].every(Number.isFinite)
        && box.width > 0
        && box.height > 0
      ) {
        return {
          box: { x: box.x, y: box.y, width: box.width, height: box.height },
          stable: true,
        };
      }
    } catch {}

    if (element.dataset.kind === "logo") {
      return { box: { x: 0, y: 0, width: 24, height: 24 }, stable: false };
    }
    const nested = element.querySelectorAll
      ? [...element.querySelectorAll("text")]
      : [];
    const lines = nested.length ? nested : [element];
    const width = Math.max(
      1,
      ...lines.map(line => (
        String(line.textContent || "").length
        * valueNumber(line.getAttribute?.("font-size"), settings.textSize, 1, 40)
        * .62
      )),
    );
    const height = settings.label
      ? settings.textSize + settings.labelSize + Math.max(0, settings.labelGap)
      : settings.textSize;
    return {
      box: { x: 0, y: 12 - height / 2, width, height },
      stable: false,
    };
  }

  function layoutMerged(svg, settings, forceMeasure = false) {
    const edgeLayer = svg.querySelector(".edge");
    const outLayer = svg.querySelector(".out");
    const fillLayer = svg.querySelector(".fills");
    const items = [...fillLayer.children];
    if (!items.length) return false;

    let boxes = !forceMeasure ? layoutCache.get(svg) : null;
    if (!boxes || boxes.length !== items.length) {
      const measured = items.map(item => safeBBox(item, settings));
      boxes = measured.map(result => result.box);
      if (measured.every(result => result.stable)) layoutCache.set(svg, boxes);
      else layoutCache.delete(svg);
    }

    const logoEdge = settings.edgeWidth * 2;
    const logoOuter = logoEdge + settings.logoOutline * 2;
    const textEdge = settings.textEdgeWidth * 2;
    const textOuter = textEdge + settings.textOutline * 2;
    let cursor = 0;
    let halfHeight = 0;

    items.forEach((item, index) => {
      const box = boxes[index];
      const isText = item.dataset.kind === "text";
      const scale = !isText && settings.equalHeight && box.height > 0
        ? settings.logoHeight / box.height
        : 1;
      const outer = isText ? textOuter : logoOuter;
      const width = Math.max(.01, box.width * scale + outer);
      const height = Math.max(.01, box.height * scale + outer);
      const tx = cursor + outer / 2 - scale * box.x;
      /* Logos centre on the midline by bounding box. Text must NOT: its box
         includes descenders, so box-centring lifts the letters above the line.
         It already sits on y=12 via dominant-baseline="central", which is the
         same midline the logos use, so it only needs an optional nudge. */
      const ty = isText
        ? settings.textNudge
        : 12 - scale * (box.y + box.height / 2);
      const shift = `translate(${tx.toFixed(2)} ${ty.toFixed(2)})` +
        (scale === 1 ? "" : ` scale(${scale.toFixed(4)})`);

      item.setAttribute("transform", shift);
      const applyStroked = (element, baseWidth) => {
        if (!element) return;
        element.setAttribute("transform", shift);
        element.setAttribute(
          "stroke-width",
          scale === 1 ? String(baseWidth) : (baseWidth / scale).toFixed(3),
        );
      };
      applyStroked(outLayer.children[index], isText ? textOuter : logoOuter);
      applyStroked(edgeLayer.children[index], isText ? textEdge : logoEdge);

      const next = items[index + 1];
      const nextIsText = next?.dataset.kind === "text";
      const spacing = index === items.length - 1
        ? 0
        : (isText || nextIsText ? settings.textGap : -settings.merge);
      cursor += width + spacing;
      halfHeight = Math.max(halfHeight, height / 2);
    });

    const pad = 1.5;
    const boxWidth = clamp(cursor + pad * 2, 1, 8192);
    const boxHeight = clamp(halfHeight * 2 + pad * 2, 1, 2048);
    if (![boxWidth, boxHeight, halfHeight].every(Number.isFinite)) return false;
    svg.setAttribute(
      "viewBox",
      `${-pad} ${(12 - halfHeight - pad).toFixed(2)} ` +
      `${boxWidth.toFixed(2)} ${boxHeight.toFixed(2)}`,
    );
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    /* Pin the element's layout box to the new viewBox. Without this the browser
       can keep the width it derived from the original 24x24 viewBox, leaving the
       artwork off-centre inside an element that is the wrong width. */
    svg.style.aspectRatio = `${boxWidth.toFixed(2)} / ${boxHeight.toFixed(2)}`;
    return true;
  }

  function fitToCanvas(settings) {
    const root = document.documentElement;
    root.style.setProperty("--fit-scale", "1");
    const bounds = row.getBoundingClientRect();
    if (!bounds.width || !bounds.height) return;
    const availableWidth = Math.max(1, innerWidth - settings.padding * 2);
    const availableHeight = Math.max(1, innerHeight - settings.padding * 2);
    const fit = clamp(
      Math.min(1, availableWidth / bounds.width, availableHeight / bounds.height),
      .05,
      1,
    );
    root.style.setProperty("--fit-scale", fit.toFixed(4));
  }

  function buildLegacyCopy(group, settings) {
    const handle = group.handle
      ? `${settings.prefix}${transformText(group.handle, settings.textCase)}`
      : "";
    const label = transformText(settings.label, settings.textCase);
    if (!handle && !label) return null;
    if (!label) {
      const name = document.createElement("span");
      name.className = "handle";
      name.textContent = handle;
      return name;
    }
    const copy = document.createElement("span");
    copy.className = "legacy-copy";
    const eyebrow = document.createElement("span");
    eyebrow.className = "legacy-label";
    eyebrow.textContent = label;
    copy.append(eyebrow);
    if (handle) {
      const name = document.createElement("span");
      name.className = "handle";
      name.textContent = handle;
      copy.append(name);
    }
    return copy;
  }

  function render(settings) {
    const version = ++renderVersion;
    const groups = parseGroups(settings.groups);
    applyAppearance(settings);
    row.replaceChildren();
    for (const group of groups) {
      const groupElement = document.createElement("span");
      groupElement.className = "group";

      const icons = document.createElement("span");
      icons.className = "icons";
      if (settings.tile) {
        for (const platform of group.platforms) {
          icons.append(buildIcon(platform, settings));
        }
        const copy = buildLegacyCopy(group, settings);
        if (settings.textSide === "left" && copy) groupElement.append(copy);
        groupElement.append(icons);
        if (settings.textSide === "right" && copy) groupElement.append(copy);
      } else {
        icons.append(buildMergedIcons(group.platforms, group.handle, settings));
        groupElement.append(icons);
      }
      row.append(groupElement);
    }

    const pack = (forceMeasure = false) => {
      if (version !== renderVersion) return;
      if (!settings.tile) {
        for (const svg of row.querySelectorAll(".merged svg")) {
          layoutMerged(svg, settings, forceMeasure);
        }
      }
      fitToCanvas(settings);
    };
    // Keep all three layout passes: attached DOM, next frame, and webfont ready.
    pack();
    requestAnimationFrame(() => pack());
    if (document.fonts?.ready) {
      const requestedFont = document.fonts.load(
        `${settings.weight} ${Math.max(settings.textSize, settings.labelSize)}px ` +
        FONTS[settings.font],
      ).catch(() => []);
      Promise.all([document.fonts.ready, requestedFont])
        .then(() => pack(true))
        .catch(() => {});
    }
  }

  function applySettings(raw) {
    const settings = normalizeSettings({ ...raw, ...queryOverrides });
    const nextKey = JSON.stringify(settings);
    if (nextKey === settingsKey) return;
    settingsKey = nextKey;
    currentSettings = settings;
    render(settings);
  }

  async function loadSettings() {
    let saved = {};
    if (instanceId && location.protocol !== "file:") {
      try {
        const response = await fetch(`/api/config?i=${encodeURIComponent(instanceId)}`, {
          cache: "no-store",
        });
        if (response.ok) {
          const payload = await response.json();
          if (payload.socialGrouped && typeof payload.socialGrouped === "object") {
            saved = payload.socialGrouped;
          }
        }
      } catch {}
    }
    return saved;
  }

  function connect() {
    if (query.get("customizer") === "1") {
      window.addEventListener("message", event => {
        if (
          event.source !== window.parent
          || event.data?.type !== "overlay-studio-draft"
          || event.data?.overlayType !== "social-grouped"
          || String(event.data?.instanceId || "") !== instanceId
          || !event.data?.config?.socialGrouped
        ) return;
        applySettings(event.data.config.socialGrouped);
      });
    }
    if (location.protocol === "file:" || !("WebSocket" in window)) return;
    let socket;
    try {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(`${protocol}//${location.host}/ws`);
    } catch {
      setTimeout(connect, 2000);
      return;
    }
    socket.onmessage = event => {
      if (typeof event.data !== "string" || event.data.length > 64 * 1024) return;
      let message;
      try { message = JSON.parse(event.data); } catch { return; }
      if (
        message?.type === "config"
        && String(message.instanceId || "") === instanceId
        && message.config?.socialGrouped
      ) {
        applySettings(message.config.socialGrouped);
      }
    };
    socket.onclose = () => setTimeout(connect, 2000);
  }

  window.addEventListener("resize", () => {
    if (currentSettings) fitToCanvas(currentSettings);
  });
  loadSettings().then(applySettings).catch(() => applySettings({}));
  connect();
})();
</script>
</body>
</html>
