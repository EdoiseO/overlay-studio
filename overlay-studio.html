<!-- ===================================================================
     OVERLAY STUDIO - local stream overlays for OBS
     Drop this single file into an OBS "Browser" source. That's it.

     QUICK CONFIG: edit the CONFIG block in the <script> below, or use
     URL params on the browser source, e.g.
       overlay.html?bpm=128&scale=1.2&pos=bottom-left
       /overlays/larpdog-dance and /overlays/spotify are separate OBS sources
     ==================================================================== -->
<meta charset="utf-8" />
<base href="/" />
<title>Overlay Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    /* accents as RGB triplets so JS can repaint them from album art */
    --a-rgb: 255, 77, 157;   /* primary  */
    --b-rgb: 255, 210, 74;   /* secondary */
    --c-rgb: 94, 224, 255;   /* tertiary  */
    --card-ink: #14101a;
    --card-fill: rgba(20, 16, 26, 0.62);
    --text: #fff7ef;
    --text-dim: rgba(255, 247, 239, 0.62);
    --pulse: 0;              /* 0..1, driven live by the audio engine */
    --scale: 1;             /* overall overlay scale, set from ?scale= */
    --card-width: 335px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;            /* essential: OBS sees through this */
    overflow: hidden;
    font-family: "Fredoka", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* the cluster sits in a corner; ?pos= flips the anchors */
  #stage {
    position: fixed;
    bottom: 36px; left: 36px;
    display: flex; align-items: flex-end; gap: 18px;
    transform: scale(var(--scale));
    transform-origin: bottom left;
  }
  #stage[data-pos="bottom-right"] { left: auto; right: 36px; transform-origin: bottom right; flex-direction: row-reverse; }
  #stage[data-pos="top-left"]     { bottom: auto; top: 36px; transform-origin: top left; }
  #stage[data-pos="top-right"]    { bottom: auto; top: 36px; left: auto; right: 36px; transform-origin: top right; flex-direction: row-reverse; }

  /* ---- the dog ---- */
  .dog-wrap {
    width: 250px; height: 250px;
    display: grid; place-items: end center;
    animation: idle-bob 2.6s ease-in-out infinite;
    filter: drop-shadow(0 14px 18px rgba(0,0,0,.35));
  }
  .dog-img {
    width: 100%; height: auto;
    transform-origin: 50% 100%;          /* squash from the feet up */
    /* live transform: lift on the beat, squash-and-stretch */
    transform:
      translateY(calc(var(--pulse) * -26px))
      scaleX(calc(1 + var(--pulse) * 0.12))
      scaleY(calc(1 - var(--pulse) * 0.10));
    will-change: transform;
  }
  @keyframes idle-bob {
    0%,100% { transform: translateY(0) rotate(-1.5deg); }
    50%     { transform: translateY(-6px) rotate(1.5deg); }
  }
  .dog-wrap.resting {
    animation: resting-bob 9s ease-in-out infinite;
  }
  .dog-wrap.resting .dog-img {
    transform:
      translateY(calc(var(--pulse) * -5px))
      scaleX(calc(1 + var(--pulse) * 0.025))
      scaleY(calc(1 - var(--pulse) * 0.018));
  }
  @keyframes resting-bob {
    0%,100% { transform: translateY(0) rotate(-0.35deg); }
    50%     { transform: translateY(-2px) rotate(0.35deg); }
  }

  /* ---- now-playing card ---- */
  .card {
    position: relative;
    width: var(--card-width);
    min-width: var(--card-width);
    max-width: var(--card-width);
    margin-bottom: 14px;
    padding: 12px 18px 12px 14px;
    display: flex; align-items: center; gap: 14px;
    background: var(--card-fill);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 20px;
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    /* glow swells with the beat */
    box-shadow:
      0 10px 30px rgba(0,0,0,.40),
      0 0 calc(8px + var(--pulse) * 34px) calc(var(--pulse) * 2px) rgba(var(--a-rgb), calc(.25 + var(--pulse) * .55));
    transform: scale(calc(1 + var(--pulse) * 0.03));
    transition: transform .04s linear;
  }
  .card.hidden, .dog-wrap.hidden { display: none; }

  /* album art (or the live EQ if no art) */
  .art {
    flex: 0 0 auto;
    width: 56px; height: 56px;
    border-radius: 12px;
    background:
      linear-gradient(135deg, rgb(var(--a-rgb)), rgb(var(--c-rgb)));
    display: grid; place-items: center;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    transition: background .6s ease;
  }
  .art img { width: 100%; height: 100%; object-fit: cover; }

  .eq { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
  .eq i {
    width: 5px; height: 30%;
    border-radius: 3px;
    background: var(--text);
    transform-origin: bottom;
  }

  .meta {
    min-width: 0;
    flex: 1 1 auto;
    overflow: hidden;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 7px;
    font-size: 9px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgb(var(--a-rgb));
    box-shadow: 0 0 calc(4px + var(--pulse)*10px) rgb(var(--a-rgb));
    transition: background .6s ease;
  }
  .title {
    font-size: 18px; font-weight: 600; line-height: 1.12;
    color: var(--text);
  }
  .artist {
    font-size: 13px; font-weight: 400;
    color: var(--text-dim);
  }
  .progress {
    width: 100%;
    height: 4px;
    margin-top: 5px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(255,255,255,0.14);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .progress-fill {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: rgb(var(--a-rgb));
    box-shadow: 0 0 calc(5px + var(--pulse) * 9px) rgba(var(--a-rgb), 0.70);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform .28s linear, background .6s ease, box-shadow .08s linear;
  }
  .card.idle .progress-fill {
    transform: scaleX(0);
  }
  .track-line {
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
  }
  .marquee-text {
    display: inline-block;
    min-width: 100%;
    white-space: nowrap;
    will-change: transform;
  }
  .track-line.is-overflowing {
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 84%, transparent 100%);
    mask-image: linear-gradient(90deg, #000 0%, #000 84%, transparent 100%);
  }
  .track-line.is-overflowing .marquee-text {
    min-width: max-content;
    padding-right: 34px;
    animation: scroll-text var(--marquee-duration, 12s) ease-in-out infinite;
  }
  @keyframes scroll-text {
    0%, 16% { transform: translateX(0); }
    84%, 100% { transform: translateX(var(--marquee-distance, -40px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .track-line.is-overflowing .marquee-text {
      animation: none;
      transform: none;
    }
  }
</style>

<div id="stage" data-pos="bottom-left">
  <div class="card idle" id="card">
    <div class="art" id="art">
      <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="meta">
      <div class="eyebrow"><span class="dot"></span><span id="status">Now playing</span></div>
      <div class="title track-line" id="title"><span class="marquee-text">waiting for a song...</span></div>
      <div class="artist track-line" id="artist"><span class="marquee-text"></span></div>
      <div class="progress" id="progress" aria-hidden="true"><span class="progress-fill" id="progressFill"></span></div>
    </div>
  </div>

  <div class="dog-wrap" id="dogWrap">
    <img class="dog-img" id="dog" alt="Dancing GIF character" src="assets/dancing-dog.gif" />
  </div>
</div>

<script src="overlay-config.js"></script>
<script>
/* =====================================================================
   CONFIG — tweak here, or override any value with a ?param in the URL
   ===================================================================== */
const SAVED_CONFIG = window.OVERLAY_STUDIO_CONFIG || window.LARPDOG_CONFIG || {};
const LEGACY_APPEARANCE = SAVED_CONFIG.appearance || {};
const SAVED_DANCE = SAVED_CONFIG.dance || {};
const SAVED_SPOTIFY = SAVED_CONFIG.spotify || {};
const SAVED_AUDIO = SAVED_CONFIG.audio || {};
const SAVED_NOW_PLAYING = SAVED_CONFIG.nowPlaying || {};
const CONFIG = {
  ui: {
    cardWidth: 335,
    asset: "both",           // "both" | "dog" | "player"
    colorMode: "auto",       // "auto" | "fixed" | "art"
  },
  nowPlaying: {
    mode: "file",            // "file" | "spotify" | "off"
    file: "nowplaying.txt",  // FILE mode: a .txt next to this html (raw line, or JSON {title,artist,art})
    pollMs: 3000,
    spotifyToken: "",        // SPOTIFY mode: paste an OAuth token, or pass ?token=
  },
  audio: {
    enabled: true,           // false = always use the auto-bounce fallback
    deviceMatch: "",         // pick input by label substring, e.g. "CABLE" — empty = system default
    sensitivity: 1.0,        // higher = dog reacts to quieter beats
    bassBins: 14,            // how many low-freq bins count as the "kick"
  },
  fallbackBpm: 120,          // bounce tempo when no audio is wired up
};

if (typeof SAVED_AUDIO.enabled === "boolean") CONFIG.audio.enabled = SAVED_AUDIO.enabled;
if (Number.isFinite(Number(SAVED_AUDIO.sensitivity))) {
  CONFIG.audio.sensitivity = Number(SAVED_AUDIO.sensitivity);
}
if (Number.isFinite(Number(SAVED_NOW_PLAYING.fallbackBpm))) {
  CONFIG.fallbackBpm = Number(SAVED_NOW_PLAYING.fallbackBpm);
}
if (Number.isFinite(Number(SAVED_SPOTIFY.cardWidth ?? LEGACY_APPEARANCE.cardWidth))) {
  CONFIG.ui.cardWidth = Number(SAVED_SPOTIFY.cardWidth ?? LEGACY_APPEARANCE.cardWidth);
}
if (LEGACY_APPEARANCE.asset) CONFIG.ui.asset = String(LEGACY_APPEARANCE.asset);
if (SAVED_SPOTIFY.colorMode || LEGACY_APPEARANCE.colorMode) {
  CONFIG.ui.colorMode = String(SAVED_SPOTIFY.colorMode || LEGACY_APPEARANCE.colorMode);
}

/* ---- URL param overrides ---- */
const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);
if (Q.get("preview") === "studio") {
  document.documentElement.style.background = "#1c2429";
  document.body.style.background = "#1c2429";
}
if (Q.has("mode"))   CONFIG.nowPlaying.mode = Q.get("mode");
if (Q.has("file"))   CONFIG.nowPlaying.file = Q.get("file");
if (Q.has("token"))  CONFIG.nowPlaying.spotifyToken = Q.get("token");
if (Q.has("device")) CONFIG.audio.deviceMatch = Q.get("device");
if (Q.has("noaudio"))CONFIG.audio.enabled = false;
CONFIG.audio.sensitivity = num("sensitivity", CONFIG.audio.sensitivity);
CONFIG.fallbackBpm = num("bpm", CONFIG.fallbackBpm);
CONFIG.ui.cardWidth = num("cardWidth", CONFIG.ui.cardWidth);
CONFIG.ui.colorMode = (Q.get("colorMode") || CONFIG.ui.colorMode).toLowerCase();
if (!["auto", "fixed", "art"].includes(CONFIG.ui.colorMode)) CONFIG.ui.colorMode = "auto";
const ROUTE_ASSET = location.pathname.includes("/overlays/larpdog-dance")
  ? "dog"
  : location.pathname.includes("/overlays/spotify")
    ? "player"
    : "";
const assetParam = (Q.get("asset") || Q.get("only") || ROUTE_ASSET || CONFIG.ui.asset).toLowerCase();
CONFIG.ui.asset = assetParam === "song" || assetParam === "card" ? "player" : assetParam;
if (!["both", "dog", "player"].includes(CONFIG.ui.asset)) CONFIG.ui.asset = "both";

const root  = document.documentElement;
const stage = document.getElementById("stage");
let dogMedia = document.getElementById("dog");
const dogWrap = document.getElementById("dogWrap");
const DEFAULT_DANCING_DOG_SRC = "assets/dancing-dog.gif";
const DEFAULT_RESTING_DOG_SRC = "assets/resting-dog.png";
const DANCING_DOG_SRC = Q.get("dog") || SAVED_DANCE.gif || SAVED_DANCE.media || LEGACY_APPEARANCE.dog || dogMedia.getAttribute("src") || dogMedia.src;
const DANCE_MODE = Q.has("dog") || SAVED_DANCE.mode !== "random" ? "single" : "random";
const SAVED_DANCE_POOL = Array.isArray(SAVED_DANCE.pool) ? SAVED_DANCE.pool : [];
const DANCING_DOG_POOL = [...new Set(
  (DANCE_MODE === "random" ? SAVED_DANCE_POOL : [DANCING_DOG_SRC])
    .map(src => String(src || "").trim())
    .filter(Boolean)
)];
if (!DANCING_DOG_POOL.length) DANCING_DOG_POOL.push(DANCING_DOG_SRC);
const RESTING_DOG_SRC = Q.get("rest") || SAVED_DANCE.rest || LEGACY_APPEARANCE.rest || DEFAULT_RESTING_DOG_SRC;
const DEFAULT_PALETTE = [[255, 77, 157], [255, 210, 74], [94, 224, 255]];
const USER_PALETTE = getUserPalette();
const ENTITY_APPEARANCE = CONFIG.ui.asset === "player" ? SAVED_SPOTIFY : SAVED_DANCE;
stage.dataset.pos = Q.get("pos") || ENTITY_APPEARANCE.position || LEGACY_APPEARANCE.position || stage.dataset.pos;
stage.dataset.asset = CONFIG.ui.asset;
root.style.setProperty("--scale", num("scale", Number(ENTITY_APPEARANCE.scale ?? LEGACY_APPEARANCE.scale) || 1));
root.style.setProperty("--card-width", CONFIG.ui.cardWidth + "px");
if (CONFIG.ui.asset === "dog") document.getElementById("card").classList.add("hidden");
if (CONFIG.ui.asset === "player") dogWrap.classList.add("hidden");
if (CONFIG.nowPlaying.mode === "off") document.getElementById("card").classList.add("hidden");
dogWrap.classList.add("resting");
let dogResting = true;
const REDUCED_MOTION = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches || false;
let dogMediaLoadRequest = 0;
let pendingDogSource = "";

function isVideoAsset(src) {
  return /\.(webm|mov|mp4)(?:[?#].*)?$/i.test(src || "");
}

function createDogMedia(src) {
  const media = isVideoAsset(src) ? document.createElement("video") : new Image();
  media.className = "dog-img";
  media.id = "dog";
  media.dataset.src = src;
  if (media.tagName === "VIDEO") {
    media.muted = true;
    media.playsInline = true;
    media.loop = !REDUCED_MOTION;
    media.autoplay = !REDUCED_MOTION;
    media.preload = REDUCED_MOTION ? "metadata" : "auto";
    media.setAttribute("aria-label", "Dancing GIF character");
    if (REDUCED_MOTION) {
      media.addEventListener("loadeddata", () => {
        media.pause();
        media.currentTime = 0;
      }, { once: true });
    }
  } else {
    media.alt = "Dancing GIF character";
  }
  return media;
}

function setDogMedia(src, onError) {
  const source = String(src || "").trim();
  if (!source) return;
  if (dogMedia?.dataset.src === source) {
    if (pendingDogSource && pendingDogSource !== source) {
      dogMediaLoadRequest += 1;
      pendingDogSource = "";
    }
    return;
  }
  if (pendingDogSource === source) return;

  const requestId = ++dogMediaLoadRequest;
  pendingDogSource = source;
  const nextMedia = createDogMedia(source);
  const readyEvent = nextMedia.tagName === "VIDEO" ? "loadeddata" : "load";
  let settled = false;

  const commit = () => {
    if (settled || requestId !== dogMediaLoadRequest) return;
    settled = true;
    pendingDogSource = "";
    dogMedia.replaceWith(nextMedia);
    dogMedia = nextMedia;
    if (nextMedia.tagName === "VIDEO" && !REDUCED_MOTION) {
      nextMedia.play().catch(() => {});
    }
  };
  const fail = () => {
    if (settled || requestId !== dogMediaLoadRequest) return;
    settled = true;
    pendingDogSource = "";
    if (typeof onError === "function") onError(source);
  };

  nextMedia.addEventListener(readyEvent, commit, { once: true });
  nextMedia.addEventListener("error", fail, { once: true });
  nextMedia.src = source;
  if (nextMedia.tagName === "VIDEO") {
    nextMedia.load();
  } else if (nextMedia.complete) {
    queueMicrotask(() => nextMedia.naturalWidth ? commit() : fail());
  }
}

let lastDanceIndex = -1;
let currentDanceSource = "";
const failedDanceSources = new Set();

function chooseDanceSource() {
  const available = DANCING_DOG_POOL
    .map((source, index) => ({ source, index }))
    .filter(({ source }) => !failedDanceSources.has(source));
  if (
    !available.length
    && !DANCING_DOG_POOL.includes(DEFAULT_DANCING_DOG_SRC)
    && !failedDanceSources.has(DEFAULT_DANCING_DOG_SRC)
  ) {
    available.push({ source: DEFAULT_DANCING_DOG_SRC, index: -1 });
  }
  if (!available.length) return "";
  if (DANCE_MODE !== "random" || available.length === 1) {
    lastDanceIndex = available[0].index;
    return available[0].source;
  }
  let next = available[Math.floor(Math.random() * available.length)];
  if (next.index === lastDanceIndex) {
    const alternatives = available.filter(({ index }) => index !== lastDanceIndex);
    next = alternatives[Math.floor(Math.random() * alternatives.length)];
  }
  lastDanceIndex = next.index;
  return next.source;
}

function handleDanceMediaError(source) {
  console.warn(`Could not load dancing media: ${source}`);
  failedDanceSources.add(source);
  if (dogResting || currentDanceSource !== source) return;
  currentDanceSource = chooseDanceSource();
  if (!currentDanceSource) {
    showRestingDog();
    return;
  }
  setDogMedia(currentDanceSource, handleDanceMediaError);
}

function handleRestingMediaError(source) {
  console.warn(`Could not load resting media: ${source}`);
  if (dogResting && source !== DEFAULT_RESTING_DOG_SRC) {
    setDogMedia(DEFAULT_RESTING_DOG_SRC, handleRestingMediaError);
  }
}

function showDancingDog(changeDance = false) {
  if (!currentDanceSource || changeDance) {
    currentDanceSource = chooseDanceSource();
  }
  if (!currentDanceSource) {
    showRestingDog();
    return;
  }
  dogResting = false;
  dogWrap.classList.remove("resting");
  setDogMedia(currentDanceSource, handleDanceMediaError);
}

function showRestingDog() {
  dogResting = true;
  dogWrap.classList.add("resting");
  setDogMedia(RESTING_DOG_SRC, handleRestingMediaError);
}

showRestingDog();

/* =====================================================================
   AUDIO ENGINE — listens to the selected input, squashes the dog on the
   beat, and drives the --pulse CSS variable that everything reacts to.
   Falls back to a steady auto-bounce if no audio is available.
   ===================================================================== */
const eqBars = [...document.querySelectorAll("#eq i")];
let pulse = 0, avg = 0, lastBeat = 0;
let standaloneAudioStarted = false;
let standaloneNowPlayingStarted = false;
window.__overlayStudio = { serverConnected: false, serverClosed: false, lastAudioAt: 0, lastTrackAt: 0 };
window.__larpdog = window.__overlayStudio;

function clamp01(n) {
  return Math.max(0, Math.min(1, Number.isFinite(n) ? n : 0));
}

function paint(level, bands) {
  root.style.setProperty("--pulse", level.toFixed(3));
  eqBars.forEach((bar, i) => {
    const h = bands ? bands[i] : 0.2 + Math.abs(Math.sin(performance.now()/180 + i)) * 0.7 * (0.4 + level);
    bar.style.height = Math.max(0.12, Math.min(1, h)) * 100 + "%";
  });
}

function restingMotionLevel() {
  return 0.045 + (Math.sin(performance.now() / 1300) + 1) * 0.025;
}

async function startRealAudio() {
  if (!CONFIG.audio.enabled) throw new Error("audio disabled");
  if (!navigator.mediaDevices?.getUserMedia) throw new Error("no getUserMedia");

  // grab default input first so device labels become readable
  let stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }});

  // if a specific input was named, switch to it
  if (CONFIG.audio.deviceMatch) {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const hit = devs.find(d => d.kind === "audioinput" &&
      d.label.toLowerCase().includes(CONFIG.audio.deviceMatch.toLowerCase()));
    if (hit) {
      stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: hit.deviceId }, echoCancellation:false, noiseSuppression:false, autoGainControl:false }});
    }
  }

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.75;
  src.connect(analyser);
  const freq = new Uint8Array(analyser.frequencyBinCount);
  const N = CONFIG.audio.bassBins;

  function loop() {
    analyser.getByteFrequencyData(freq);

    // kick energy = average of the lowest bins
    let bass = 0;
    for (let i = 0; i < N; i++) bass += freq[i];
    bass = (bass / N) / 255;                         // 0..1

    // Keep smoothing/threshold/band math in sync with the Overlay Studio server.
    avg = avg * 0.92 + bass * 0.08;
    const threshold = avg * (1.35 / Math.max(0.3, CONFIG.audio.sensitivity));
    const now = performance.now();
    if (bass > threshold && bass > 0.12 && now - lastBeat > 110) {
      pulse = 1; lastBeat = now;
    }
    pulse *= 0.86;                                    // decay

    // 5-band spectrum for the EQ bars
    const bands = [0,1,2,3,4].map(b => {
      const lo = Math.floor(b * freq.length / 12);
      const hi = Math.floor((b+1) * freq.length / 12);
      let s = 0; for (let i = lo; i < hi; i++) s += freq[i];
      return (s / (hi - lo)) / 255;
    });

    paint(dogResting ? restingMotionLevel() : Math.max(pulse, bass * 0.55), bands);
    requestAnimationFrame(loop);
  }
  loop();
}

function startFallback() {
  // no audio wired up — bounce on a metronome so the dog still parties
  const beat = () => { if (!dogResting) pulse = 1; };
  let interval = 60000 / Math.max(40, CONFIG.fallbackBpm);
  setInterval(beat, interval);
  (function loop(){
    if (dogResting) paint(restingMotionLevel(), null);
    else { pulse *= 0.88; paint(pulse, null); }
    requestAnimationFrame(loop);
  })();
}

function startStandaloneAudio() {
  if (standaloneAudioStarted) return;
  standaloneAudioStarted = true;
  (async () => {
    try { await startRealAudio(); }
    catch (e) { console.warn("[overlay-studio] live audio unavailable, using auto-bounce:", e.message); startFallback(); }
  })();
}

function paintServerAudio(msg) {
  window.__larpdog.lastAudioAt = Date.now();
  if (dogResting) {
    paint(restingMotionLevel(), [0.16, 0.13, 0.15, 0.12, 0.14]);
    return;
  }
  const serverLevel = clamp01(Number(msg.level));
  if (msg.beat) pulse = 1;
  pulse = Math.max(pulse * 0.86, serverLevel);
  const bands = Array.isArray(msg.bands) ? msg.bands.slice(0, 5).map(n => clamp01(Number(n))) : null;
  paint(pulse, bands);
}

function startStandaloneNowPlaying() {
  if (standaloneNowPlayingStarted) return;
  standaloneNowPlayingStarted = true;

  // instant test override: ?song=Title&artist=Name&art=URL
  if (Q.has("song")) {
    showSong({
      title: Q.get("song"),
      artist: Q.get("artist"),
      art: Q.get("art"),
      progressMs: num("progress", 0),
      durationMs: num("duration", 0),
    });
  } else if (CONFIG.nowPlaying.mode === "off") {
    document.getElementById("card").classList.add("hidden");
  } else if (CONFIG.nowPlaying.mode === "spotify") {
    pollSpotify(); setInterval(pollSpotify, CONFIG.nowPlaying.pollMs);
  } else {
    pollFile(); setInterval(pollFile, CONFIG.nowPlaying.pollMs);
  }
}

function startStandaloneSources() {
  startStandaloneAudio();
  startStandaloneNowPlaying();
}

function serverWsUrl() {
  const host = location.host || "localhost:8473";
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return `${proto}//${host}/ws`;
}

function connectOverlayStudioServer() {
  if (!("WebSocket" in window)) return Promise.resolve(false);

  return new Promise(resolve => {
    let settled = false;
    let connected = false;
    let ws;
    const fail = () => {
      if (settled) return;
      settled = true;
      try { ws?.close(); } catch {}
      resolve(false);
    };
    const timeout = setTimeout(fail, 2000);

    try { ws = new WebSocket(serverWsUrl()); }
    catch { clearTimeout(timeout); return fail(); }

    ws.onopen = () => {
      connected = true;
      window.__larpdog.serverConnected = true;
      window.__larpdog.serverClosed = false;
      if (!settled) {
        settled = true;
        clearTimeout(timeout);
        resolve(true);
      }
    };
    ws.onmessage = event => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      if (msg.type === "audio") {
        paintServerAudio(msg);
      } else if (msg.type === "track") {
        window.__larpdog.lastTrackAt = Date.now();
        if (msg.isPlaying) {
          showSong({
            trackId: msg.trackId,
            title: msg.title,
            artist: msg.artist,
            art: msg.art,
            progressMs: msg.progressMs,
            durationMs: msg.durationMs,
          });
        }
        else showIdle();
      } else if (msg.type === "config") {
        location.reload();
      }
    };
    ws.onerror = () => { if (!connected) fail(); };
    ws.onclose = () => {
      window.__larpdog.serverClosed = true;
      clearTimeout(timeout);
      if (!connected) fail();
      else startStandaloneSources();
    };
  });
}


/* =====================================================================
   COLOR ENGINE — pulls a vivid palette from an image (album art, or the
   dog itself) and repaints the card accents / glow to match.
   ===================================================================== */
let dogPalette = null;   // sampled from the gif, used whenever nothing's playing

function colorDist(a, b) {
  return Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]);
}

function extractPalette(img, maxColors = 3) {
  const c = document.createElement("canvas");
  const w = (c.width = 48), h = (c.height = 48);
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  let data;
  try { data = ctx.getImageData(0, 0, w, h).data; }
  catch (e) { return null; }                    // cross-origin / tainted

  const buckets = new Map();
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 125) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const key = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
    let o = buckets.get(key);
    if (!o) buckets.set(key, (o = { r: 0, g: 0, b: 0, n: 0 }));
    o.r += r; o.g += g; o.b += b; o.n++;
  }

  const cols = [];
  for (const o of buckets.values()) {
    const r = o.r / o.n, g = o.g / o.n, b = o.b / o.n;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const sat = mx === 0 ? 0 : (mx - mn) / mx;
    const lum = (mx + mn) / 2 / 255;
    // reward saturated, mid-bright, well-represented colors
    const score = o.n * (0.15 + sat) * (0.3 + (1 - Math.abs(lum - 0.55)));
    cols.push({ rgb: [Math.round(r), Math.round(g), Math.round(b)], score });
  }
  cols.sort((x, y) => y.score - x.score);

  const picked = [];
  for (const col of cols) {
    if (picked.length >= maxColors) break;
    if (picked.every(p => colorDist(p.rgb, col.rgb) > 60)) picked.push(col);
  }
  while (picked.length && picked.length < maxColors) picked.push(picked[0]);
  return picked.length ? picked.map(p => p.rgb) : null;
}

function normalizeHex(value) {
  const raw = String(value || "").trim().replace(/^#/, "");
  return /^[0-9a-f]{6}$/i.test(raw) ? raw : null;
}

function hexToRgb(value) {
  const hex = normalizeHex(value);
  if (!hex) return null;
  const n = parseInt(hex, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function getUserPalette() {
  const savedColors = SAVED_SPOTIFY.colors || LEGACY_APPEARANCE.colors || {};
  const a = hexToRgb(Q.has("a") ? Q.get("a") : savedColors.a);
  const b = hexToRgb(Q.has("b") ? Q.get("b") : savedColors.b);
  const c = hexToRgb(Q.has("c") ? Q.get("c") : savedColors.c);
  if (!a && !b && !c) return null;
  return [a || DEFAULT_PALETTE[0], b || a || DEFAULT_PALETTE[1], c || a || DEFAULT_PALETTE[2]];
}

function applyPalette(pal) {
  if (!pal) return;
  const [a, b = pal[0], c = pal[0]] = pal;
  root.style.setProperty("--a-rgb", a.join(","));
  root.style.setProperty("--b-rgb", b.join(","));
  root.style.setProperty("--c-rgb", c.join(","));
}

function fallbackPalette() {
  if (CONFIG.ui.colorMode === "art") return USER_PALETTE || DEFAULT_PALETTE;
  return USER_PALETTE || dogPalette || DEFAULT_PALETTE;
}

function applyArtwork(url) {
  if (CONFIG.ui.colorMode === "fixed") {
    applyPalette(fallbackPalette());
    return;
  }
  // try to recolor from the album cover; if blocked, keep the dog palette
  const im = new Image();
  im.crossOrigin = "anonymous";
  im.onload = () => { const p = extractPalette(im); applyPalette(p || fallbackPalette()); };
  im.onerror = () => applyPalette(fallbackPalette());
  im.src = url;
}

function samplePaletteFromSource(src, onPalette) {
  if (isVideoAsset(src)) {
    const video = document.createElement("video");
    video.crossOrigin = "anonymous";
    video.muted = true;
    video.playsInline = true;
    video.preload = "auto";
    video.onloadeddata = () => onPalette(extractPalette(video));
    video.onerror = () => onPalette(null);
    video.src = src;
    video.load();
    return;
  }

  const image = new Image();
  image.crossOrigin = "anonymous";
  image.onload = () => onPalette(extractPalette(image));
  image.onerror = () => onPalette(null);
  image.src = src;
}

// seed the default palette from the dog as soon as the gif is ready
(function seedDogPalette() {
  if (CONFIG.ui.colorMode === "fixed") {
    applyPalette(fallbackPalette());
    return;
  }
  samplePaletteFromSource(DANCING_DOG_SRC, pal => {
    dogPalette = pal || null;
    applyPalette(dogPalette || fallbackPalette());
  });
})();

/* =====================================================================
   NOW PLAYING — fills the card. file / spotify / off.
   ===================================================================== */
const $title = document.getElementById("title");
const $artist = document.getElementById("artist");
const $status = document.getElementById("status");
const $card = document.getElementById("card");
const $art = document.getElementById("art");
const $eq = document.getElementById("eq");
const $progressFill = document.getElementById("progressFill");
let trackProgress = { progressMs: 0, durationMs: 0, startedAt: 0, active: false };
let lastTrackIdentity = "";

function setTrackLine(el, text) {
  const inner = el.querySelector(".marquee-text");
  if (!inner) return;

  const nextText = text || "";
  const currentWidth = el.clientWidth;
  if (inner.textContent === nextText && Number(el.dataset.marqueeWidth) === currentWidth) {
    return;
  }

  inner.textContent = nextText;
  el.classList.remove("is-overflowing");
  el.style.removeProperty("--marquee-distance");
  el.style.removeProperty("--marquee-duration");
  delete el.dataset.marqueeWidth;

  requestAnimationFrame(() => {
    const lineWidth = el.clientWidth;
    const overflow = inner.scrollWidth - lineWidth;
    el.dataset.marqueeWidth = String(lineWidth);
    if (overflow <= 2) return;
    const distance = Math.ceil(overflow + 34);
    const duration = Math.min(18, Math.max(9, distance / 18));
    el.style.setProperty("--marquee-distance", `-${distance}px`);
    el.style.setProperty("--marquee-duration", `${duration}s`);
    el.classList.add("is-overflowing");
  });
}

function setProgress(progressMs, durationMs) {
  const progress = Math.max(0, Number(progressMs) || 0);
  const duration = Math.max(0, Number(durationMs) || 0);
  const active = duration > 0;
  trackProgress = {
    progressMs: Math.min(progress, duration || progress),
    durationMs: duration,
    startedAt: performance.now(),
    active,
  };
  $card.classList.toggle("idle", !active);
}

function paintProgress() {
  let ratio = 0;
  if (trackProgress.active) {
    const elapsed = performance.now() - trackProgress.startedAt;
    ratio = (trackProgress.progressMs + elapsed) / trackProgress.durationMs;
  }
  $progressFill.style.transform = `scaleX(${clamp01(ratio).toFixed(4)})`;
  requestAnimationFrame(paintProgress);
}
requestAnimationFrame(paintProgress);

function trackIdentity({ trackId, title, artist, durationMs }) {
  const explicitId = String(trackId || "").trim();
  if (explicitId) return `id:${explicitId}`;
  return [
    String(title || "").trim().toLocaleLowerCase(),
    String(artist || "").trim().toLocaleLowerCase(),
    Math.max(0, Number(durationMs) || 0),
  ].join("\u0000");
}

function showSong(song) {
  const { title, artist, art, progressMs, durationMs } = song;
  const nextTrackIdentity = trackIdentity(song);
  const trackChanged = Boolean(
    lastTrackIdentity
    && nextTrackIdentity
    && nextTrackIdentity !== lastTrackIdentity
  );
  if (nextTrackIdentity) lastTrackIdentity = nextTrackIdentity;
  showDancingDog(trackChanged);
  setTrackLine($title, title || "-");
  setTrackLine($artist, artist || "");
  setProgress(progressMs, durationMs);
  $status.textContent = "Now playing";
  if (art) {
    const img = new Image();
    img.alt = "";
    img.src = art;
    $art.replaceChildren(img);
    applyArtwork(art);                 // recolor card from the cover
  } else {
    $art.replaceChildren($eq);
    applyPalette(fallbackPalette());   // no cover -> fall back to user/dog colors
  }
}
function showIdle(msg) {
  showRestingDog();
  setTrackLine($title, msg || "waiting for a song...");
  setTrackLine($artist, "");
  setProgress(0, 0);
  $status.textContent = "Standing by";
  applyPalette(fallbackPalette());
}

async function pollFile() {
  try {
    const r = await fetch(CONFIG.nowPlaying.file + "?t=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    const raw = (await r.text()).trim();
    if (!raw) return showIdle();
    try {                                  // JSON form: {title, artist, art}
      const j = JSON.parse(raw);
      showSong({
        trackId: j.trackId || j.id,
        title: j.title || j.song,
        artist: j.artist,
        art: j.art || j.albumArt,
        progressMs: j.progressMs || j.progress || 0,
        durationMs: j.durationMs || j.duration || 0,
      });
    } catch {                              // plain text: whole line is the title
      showSong({ title: raw });
    }
  } catch { showIdle("no nowplaying.txt found"); }
}

async function pollSpotify() {
  const tok = CONFIG.nowPlaying.spotifyToken;
  if (!tok) return showIdle("add a Spotify token");
  try {
    const r = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
      headers: { Authorization: "Bearer " + tok }
    });
    if (r.status === 204) return showIdle("nothing playing");
    if (r.status === 401) return showIdle("Spotify token expired");
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d || !d.item) return showIdle();
    showSong({
      trackId: d.item.id || d.item.uri,
      title: d.item.name,
      artist: (d.item.artists || []).map(a => a.name).join(", "),
      art: d.item.album?.images?.[0]?.url,
      progressMs: d.progress_ms,
      durationMs: d.item.duration_ms,
    });
  } catch (e) { showIdle("Spotify error"); }
}

(async () => {
  if (Q.has("song") || Q.has("noserver")) {
    startStandaloneSources();
    return;
  }
  const usingServer = await connectOverlayStudioServer();
  if (!usingServer) startStandaloneSources();
})();
</script>
